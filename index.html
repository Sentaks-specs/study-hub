px}\nsection h3{font-size:22px;margin:40px 0 12px}\nsection ul,section ol{margin:0 0 20px}\nsection li{margin:8px 0}\n.def{background:var(--tint);border-left:6px solid var(--a);border-radius:0 16px 16px 0;padding:18px 22px;margin:26px 0}\n.fun{background:transparent;border:1.5px dashed var(--a);border-radius:16px;padding:16px 20px;margin:28px 0;font-size:.95em;line-height:1.75}\n.slide{background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px;margin:28px 0}\n.slide .k{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}\n.topic{border:1.5px solid var(--line);border-radius:20px;padding:10px 22px 18px;margin-top:30px;background:var(--bg)}\n.topic h3{display:flex;align-items:center;gap:14px;font-size:24px;margin:12px 0 16px}\n.topic .sy{display:inline-grid;place-items:center;min-width:50px;height:50px;padding:0 10px;border-radius:14px;background:var(--a);color:var(--card);font-size:22px;margin:0;flex:none}\n.topic .def,.topic .fun{background-clip:padding-box}\n.wide{border:1.5px solid var(--line);border-radius:14px;margin:22px 0}\n.wide table{margin:0;border-collapse:collapse}\nth{padding:12px 14px;background:var(--tint);color:var(--ink);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}\ntd{padding:13px 14px;font-size:16.5px;line-height:1.6}\ntr:nth-child(even) td{background:rgba(127,147,190,.07)}\ntr:last-child td{border-bottom:none}\ncode,.m{padding:3px 9px;font-size:.88em}\n.ex{display:block;margin-top:6px;padding:10px 14px;border-radius:10px;font-size:15.5px}\n.q{padding:18px 0}\nbutton{padding:10px 17px;margin:6px 8px 6px 0;border-radius:10px}\n.why{font-size:16px;margin-top:8px;line-height:1.6}\ndetails{padding:12px 18px;border-radius:14px;margin:20px 0}\ndetails p{margin:10px 0 4px}\n.drill .it{padding:12px 0}\n.fig{margin:26px 0 10px}\n.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:38px;padding-top:20px;border-top:1.5px solid var(--line)}\n.pager a{font:700 15px \"Space Grotesk\",sans-serif;color:var(--a);text-decoration:none;padding:10px 16px;border:1.5px solid var(--a);border-radius:12px}\n.chip.on{background:var(--ink);color:var(--bg)}\n#bar{position:fixed;left:0;top:0;height:4px;width:0;background:linear-gradient(90deg,#2f5dff,#12a37f);z-index:20;transition:width .1s}\n@media(max-width:520px){section{padding:26px 18px 20px;border-radius:18px}.topic{padding:6px 16px 14px}.part{padding:24px 20px}}\n.kws{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0 26px}\n.kw{background:var(--bg);border:1.5px solid var(--line);border-left:6px solid var(--a);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}\n.kw b{font:700 18px \"Space Grotesk\",sans-serif}\n.kw span{font-size:16px;line-height:1.55;color:var(--mute);transition:filter .15s}\n.testing .kw{cursor:pointer}\n.testing .kw:not(.show) span{filter:blur(7px);user-select:none}\n.syms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 22px}\n.sm{background:var(--tint);border-radius:14px;padding:14px 12px;text-align:center}\n.sm i{display:block;font:700 28px \"Space Grotesk\",sans-serif;font-style:normal;color:var(--a);margin-bottom:4px}\n.sm span{font-size:14.5px;line-height:1.4}\n.tst{background:var(--ink);color:var(--bg);margin:6px 0 4px}\n.testing .tst{background:var(--a);color:var(--card);border-color:var(--a)}\n.hint{font-size:14.5px;color:var(--mute);margin:4px 0 6px}\nsection.recap{border:2px solid var(--a)}\nsection.recap h2 .num{border-radius:50%}\n\n/* symbol sheet */\n.symgrid .kw{flex-direction:row;align-items:flex-start;gap:16px}\n.symgrid .kw b{flex:none;min-width:62px;text-align:center;font-size:28px;color:var(--a);line-height:1.2}\n.symgrid .kw span{line-height:1.6;color:var(--mute)}\n.symgrid .kw strong{color:var(--ink);font-family:\"Space Grotesk\",sans-serif}\n\n/* ready for a Part 3: add \u003cdiv class=\"part\"> then sections and it picks this up */\nsection.p3{--a:#c2570c;--tint:#fdeee0}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) section.p3{--a:#ffa65c;--tint:#3a2a1c}}\n:root[data-theme=\"dark\"] section.p3{--a:#ffa65c;--tint:#3a2a1c}\n.part.p3{background:linear-gradient(135deg,#7a3b0c,#d9731a)}\n\n:root{--a:#c2570c;--tint:#fdeee0}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--a:#ffa65c;--tint:#3a2a1c}}\n:root[data-theme=\"dark\"]{--a:#ffa65c;--tint:#3a2a1c}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003ch1>Entrepreneurship, lesson by lesson\u003c/h1>\n\u003cp class=\"lead\">One reading site built from your five class materials: the Entrepreneurial Mindset handout, the Characteristics and Competencies slides, Entrepreneurship in the Philippines, Global Supply Chain, and the SWOT and PESTLE class. Each lesson has key ideas, tables you can scan, and short quizzes. Wording is simplified, so use your teacher's terms when they differ.\u003c/p>\n\n\u003csection id=\"l1\">\u003ch2>1. What is entrepreneurship?\u003c/h2>\n\u003cdiv class=\"def\">\u003cb>Entrepreneurship\u003c/b> is the process of identifying an opportunity, organizing resources, accepting calculated risks, and creating value through a new or improved product, service, or process.\u003cbr>\u003cbr>An \u003cb>entrepreneur\u003c/b> is a person who identifies an opportunity, organizes resources, takes calculated risks, and creates a business or enterprise to provide a product or service.\u003c/div>\n\u003cp>It is not limited to big companies. It can mean opening a small food business, selling through social media, developing a mobile app, introducing an improved farming process, starting a social enterprise, or expanding a family business. A person can be entrepreneurial without owning a business.\u003c/p>\n\u003ch3>Important elements\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Element\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Opportunity recognition\u003c/td>\u003ctd>Spotting an unmet need or problem\u003c/td>\u003ctd>Students need affordable printing near campus\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Innovation\u003c/td>\u003ctd>Introducing something new or improved\u003c/td>\u003ctd>Online ordering for a local carinderia\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Resource organization\u003c/td>\u003ctd>Combining people, money, materials, technology\u003c/td>\u003ctd>Using classmates' skills to run an online store\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Calculated risk-taking\u003c/td>\u003ctd>Assessing possible losses before acting\u003c/td>\u003ctd>Testing a product before investing heavily\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Value creation\u003c/td>\u003ctd>Giving customers or society a useful benefit\u003c/td>\u003ctd>Selling affordable reusable water bottles\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sustainability\u003c/td>\u003ctd>Keeping the enterprise viable over time\u003c/td>\u003ctd>Controlling costs and keeping customers\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>Selling vs. entrepreneurship\u003c/h3>\n\u003cp>A student who occasionally sells snacks is \u003cb>selling\u003c/b>. A student who studies customer preferences, creates snack packages, calculates costs, promotes on social media, and improves the product from feedback is showing \u003cb>entrepreneurship\u003c/b>. Selling becomes entrepreneurial when it involves opportunity recognition, planning, innovation, calculated risks, and value creation.\u003c/p>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Solution\u003c/th>\u003cth>System\u003c/th>\u003cth>Initiative\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Classmates have no time to buy snacks\u003c/td>\u003ctd>Sell affordable packed snacks\u003c/td>\u003ctd>Accept advance orders online\u003c/td>\u003ctd>Provide a useful product responsibly\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"fun\">\u003cb>Think about it:\u003c/b> Why is entrepreneurship more than simply earning money? What makes a business opportunity different from an ordinary idea? How can entrepreneurship help community development?\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q1\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l2\">\u003ch2>2. The entrepreneurial mindset\u003c/h2>\n\u003cdiv class=\"def\">A way of thinking that lets a person recognize opportunities, solve problems creatively, make informed decisions, learn from failure, and create value despite limited resources or uncertainty.\u003c/div>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Trait\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1. Opportunity recognition\u003c/td>\u003ctd>Notice problems, changing preferences, market gaps, trends\u003c/td>\u003ctd>Long printing queues lead to online file submission and scheduled pickup\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2. Creativity and innovation\u003c/td>\u003ctd>Creativity is generating useful ideas. Innovation is applying them to produce value\u003c/td>\u003ctd>Discarded cloth into reusable bags is creative. Producing, branding, and selling them is innovation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3. Calculated risk-taking\u003c/td>\u003ctd>Collect information, estimate outcomes, prepare alternatives\u003c/td>\u003ctd>Survey customers, make a prototype, start small, get feedback\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4. Resilience\u003c/td>\u003ctd>Recover from setbacks and keep improving\u003c/td>\u003ctd>A failed launch: find the cause, revise, test again\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5. Initiative and proactiveness\u003c/td>\u003ctd>Act on opportunities instead of waiting\u003c/td>\u003ctd>Fix the problem yourself\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6. Adaptability\u003c/td>\u003ctd>Adjust to changes in customers, technology, competition, economy\u003c/td>\u003ctd>Add new menu items when trends shift\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>7. Customer orientation\u003c/td>\u003ctd>Understand and respond to customer needs without losing the core purpose\u003c/td>\u003ctd>Listen to feedback\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8. Ethics and social responsibility\u003c/td>\u003ctd>Consider employees, customers, community, environment\u003c/td>\u003ctd>Accurate product info, fair pay, protect customer data, comply with regulations\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>Scenario: the milk-tea shop\u003c/h3>\n\u003cp>Customers are leaving because healthier drinks are trending. Options: (a) lower prices, keep the menu; (b) add fruit-based, low-sugar drinks; (c) ignore the trend. Option (b) shows \u003cb>adaptability\u003c/b>. Before deciding, the owner should gather evidence (customer survey, sales data, competitor menus) and test cheaply, for example with a small trial batch.\u003c/p>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q2\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l3\">\u003ch2>3. Characteristics and competencies\u003c/h2>\n\u003cp>\u003cb>Characteristics\u003c/b> describe \u003ci>who\u003c/i> an entrepreneur is. \u003cb>Competencies\u003c/b> describe \u003ci>what\u003c/i> an entrepreneur can do effectively.\u003c/p>\n\u003ch3>Five characteristics\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>In action\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>A. Self-confidence\u003c/td>\u003ctd>Believing in your ability to achieve a goal\u003c/td>\u003ctd>Helps in presenting ideas, negotiating, acting under uncertainty\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>B. Initiative\u003c/td>\u003ctd>Acting without always waiting for instructions\u003c/td>\u003ctd>Turns a complaint into a service\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C. Persistence\u003c/td>\u003ctd>Continuing despite difficulties or failure\u003c/td>\u003ctd>Improve designs and marketing instead of closing after low sales\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D. Creativity and innovation\u003c/td>\u003ctd>Creativity is thinking of an idea; innovation is putting it into practice\u003c/td>\u003ctd>New product designs sold through social media\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>E. Calculated risk\u003c/td>\u003ctd>Study benefits and losses before acting\u003c/td>\u003ctd>Study customers, check location, estimate expenses and sales, test the product\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"def\">\u003cb>Calculated risk = research + planning.\u003c/b> Reckless risk = little regard for consequences.\u003c/div>\n\u003ch3>Five competencies\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Competency\u003c/th>\u003cth>What it means\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Goal setting\u003c/td>\u003ctd>A goal gives direction. Strong goal: “Increase monthly online sales by 15% within three months.”\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Problem-solving\u003c/td>\u003ctd>Analyze the situation and build practical solutions when suppliers, demand, expenses, or defects become problems\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Decision-making\u003c/td>\u003ctd>Choose products, prices, hiring, advertising, expansion based on information, not emotion alone\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Communication skills\u003c/td>\u003ctd>Explain ideas, negotiate, persuade customers, maintain professional relationships (customers, employees, suppliers, investors, partners)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Time management\u003c/td>\u003ctd>Juggle customers, buying supplies, advertising, finances, and supervising workers\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"fun\">\u003cb>Mini-scenario:\u003c/b> The milk-tea shop runs out of cups because the supplier cannot deliver. What should the owner do? (Problem-solving and decision-making: contact backup suppliers, tell customers honestly, adjust the menu temporarily.)\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q3\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l4\">\u003ch2>4. Types of entrepreneurs and common challenges\u003c/h2>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Innovative\u003c/td>\u003ctd>Introduces new ideas, products, services, or processes\u003c/td>\u003ctd>App for ordering farm products directly from farmers\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Imitative\u003c/td>\u003ctd>Adopts an existing idea but improves or adapts it\u003c/td>\u003ctd>Milk-tea shop with local flavors or cheaper prices\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Social\u003c/td>\u003ctd>Solves a community problem while staying sustainable\u003c/td>\u003ctd>Livelihood, recycling, education projects\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Small business\u003c/td>\u003ctd>Runs local businesses serving local markets\u003c/td>\u003ctd>Sari-sari stores, food stalls, online shops, printing services\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>Common challenges\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Challenge\u003c/th>\u003cth>Includes\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Financial\u003c/td>\u003ctd>Equipment, materials, rent, salaries, marketing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Competition\u003c/td>\u003ctd>Customer preferences, competitor prices, quality, trends\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Changing preferences\u003c/td>\u003ctd>What is popular today may not stay popular\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Technology\u003c/td>\u003ctd>Social media, online payment, selling, communication, service\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Fear of failure\u003c/td>\u003ctd>Failure shows what went wrong and what to improve\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>Key mindset:\u003c/b> entrepreneurs observe changes, adapt, and use failure as information for improvement.\u003c/p>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q4\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l5\">\u003ch2>5. Types of organizations\u003c/h2>\n\u003cp>An organization is a structured group of people working toward a common purpose. They can be classified by ownership, purpose, control, and legal structure.\u003c/p>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Advantages\u003c/th>\u003cth>Limitations\u003c/th>\u003cth>Best when\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Sole proprietorship\u003cbr>\u003csmall>one owner. e.g. repair shop, sari-sari store\u003c/small>\u003c/td>\u003ctd>Easy to start, quick decisions, owner keeps profit, few conflicts\u003c/td>\u003ctd>Limited capital and expertise, depends on owner, possibly unlimited personal liability\u003c/td>\u003ctd>Small, manageable risk, one person wants full control\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Partnership\u003cbr>\u003csmall>two or more owners. e.g. accounting firm, design studio\u003c/small>\u003c/td>\u003ctd>More capital, shared work, combined skills, wider network\u003c/td>\u003ctd>Disagreements, shared profits, slower decisions, possible shared obligations\u003c/td>\u003ctd>Need complementary skills or shared investment\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Corporation\u003cbr>\u003csmall>legal entity separate from owners. e.g. large manufacturers, telecoms\u003c/small>\u003c/td>\u003ctd>Raises capital easily, continues despite ownership change, limited liability, large scale\u003c/td>\u003ctd>More legal requirements, higher costs, complex decisions, ownership separate from management\u003c/td>\u003ctd>Large capital, expansion, bigger financial risk\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cooperative\u003cbr>\u003csmall>owned and democratically controlled by members. e.g. farmers' coop\u003c/small>\u003c/td>\u003ctd>Shared benefits, democratic decisions, collective bargaining, community focus\u003c/td>\u003ctd>Slower decisions, limited capital, uneven participation\u003c/td>\u003ctd>People with a common need pool resources\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nonprofit\u003cbr>\u003csmall>mission-first. e.g. educational foundation\u003c/small>\u003c/td>\u003ctd>Serves a social, educational, cultural, environmental, or humanitarian purpose\u003c/td>\u003ctd>Depends on donations, grants, fees\u003c/td>\u003ctd>The goal is a mission, not owner profit\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>A nonprofit may earn revenue. What matters is that it does not distribute profits to private owners, and surplus supports its mission.\u003c/p>\n\u003ch3>Side-by-side\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>Sole\u003c/th>\u003cth>Partnership\u003c/th>\u003cth>Corporation\u003c/th>\u003cth>Cooperative\u003c/th>\u003cth>Nonprofit\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Ownership\u003c/td>\u003ctd>One person\u003c/td>\u003ctd>2 or more partners\u003c/td>\u003ctd>Shareholders\u003c/td>\u003ctd>Members\u003c/td>\u003ctd>No private owners\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Decisions\u003c/td>\u003ctd>Owner\u003c/td>\u003ctd>Partners\u003c/td>\u003ctd>Board and management\u003c/td>\u003ctd>Member-based\u003c/td>\u003ctd>Board or trustees\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Capital\u003c/td>\u003ctd>Usually limited\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>Generally high\u003c/td>\u003ctd>Member contributions\u003c/td>\u003ctd>Donations, grants, fees\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Complexity\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>Moderate to high\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q5\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l6\">\u003ch2>6. Types of businesses and products\u003c/h2>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Business type\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Service\u003c/td>\u003ctd>Provides skills, labor, knowledge, or help\u003c/td>\u003ctd>Salon, repair shop, tutorial center, web agency\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Merchandising\u003c/td>\u003ctd>Buys finished goods and resells them\u003c/td>\u003ctd>Grocery, clothing shop, gadget retailer\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Manufacturing\u003c/td>\u003ctd>Turns raw materials into finished goods\u003c/td>\u003ctd>Furniture maker, food processor, garment factory\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hybrid\u003c/td>\u003ctd>Combines two or more types\u003c/td>\u003ctd>Bakery that bakes, sells, and caters\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>Classify it:\u003c/b> a computer shop sells laptops (merchandising), repairs devices (service), and assembles custom desktops (manufacturing). Overall: \u003cb>hybrid\u003c/b>.\u003c/p>\n\u003ch3>Types of products\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Product\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Goods\u003c/td>\u003ctd>Tangible: you can see, touch, own, store\u003c/td>\u003ctd>Phones, clothing, food, furniture\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Services\u003c/td>\u003ctd>Intangible activities or benefits\u003c/td>\u003ctd>Repair, transport, tutoring, consulting\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Digital products\u003c/td>\u003ctd>Created, delivered, and used electronically\u003c/td>\u003ctd>Apps, e-books, online courses, subscriptions\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Experiences\u003c/td>\u003ctd>Product, service, and setting blended into a memorable engagement\u003c/td>\u003ctd>Cultural tour, themed restaurant, workshop\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Social or environmental solutions\u003c/td>\u003ctd>Address a social or environmental concern while creating value\u003c/td>\u003ctd>Low-cost learning materials, recycling, solar devices\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>Six questions to evaluate a product\u003c/h3>\n\u003cul class=\"eg\">\u003cli>What need does it address?\u003c/li>\u003cli>Who benefits?\u003c/li>\u003cli>How is it different from existing products?\u003c/li>\u003cli>Can customers afford it?\u003c/li>\u003cli>Can the business deliver it consistently?\u003c/li>\u003cli>Is it socially and environmentally responsible?\u003c/li>\u003c/ul>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q6\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l7\">\u003ch2>7. Entrepreneurship models\u003c/h2>\n\u003cp>A model describes how a venture is developed and what purpose or growth direction it follows.\u003c/p>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Example\u003c/th>\u003cth>Main goal\u003c/th>\u003cth>Strength\u003c/th>\u003cth>Challenge\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Small business\u003c/td>\u003ctd>Sari-sari store, local cafe, repair shop\u003c/td>\u003ctd>Stable income, sustain operations\u003c/td>\u003ctd>Close customer relationships\u003c/td>\u003ctd>Limited capital and reach\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Scalable startup\u003c/td>\u003ctd>Mobile payment or logistics app\u003c/td>\u003ctd>Rapid growth, market expansion\u003c/td>\u003ctd>High growth potential\u003c/td>\u003ctd>High uncertainty, big funding needs\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Social\u003c/td>\u003ctd>Water filtration enterprise, recycled-materials livelihood\u003c/td>\u003ctd>Measurable social value and financial sustainability\u003c/td>\u003ctd>Positive impact\u003c/td>\u003ctd>Balancing mission and money\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Intrapreneurship\u003c/td>\u003ctd>Bank team building a mobile banking app\u003c/td>\u003ctd>Help an established firm innovate\u003c/td>\u003ctd>Company resources\u003c/td>\u003ctd>Resistance, approval processes\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Franchise\u003c/td>\u003ctd>Food kiosk, convenience store\u003c/td>\u003ctd>Run a tested concept\u003c/td>\u003ctd>Known brand and procedures\u003c/td>\u003ctd>Fees, rules, less independence\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Digital\u003c/td>\u003ctd>Online marketplace, software service, online tutoring\u003c/td>\u003ctd>Reach customers through digital channels\u003c/td>\u003ctd>Wide reach, flexible\u003c/td>\u003ctd>Cybersecurity, competition, fast tech change\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>Comparison\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Growth potential\u003c/th>\u003cth>Typical risk\u003c/th>\u003cth>Suitable situation\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Small business\u003c/td>\u003ctd>Low to moderate\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>Serving a local market\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Scalable startup\u003c/td>\u003ctd>Very high\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Innovative solution, large market\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Social enterprise\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>Addressing a community problem\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Intrapreneurship\u003c/td>\u003ctd>Moderate to high\u003c/td>\u003ctd>Shared with the organization\u003c/td>\u003ctd>Existing organization needs innovation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Franchise\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>Moderate\u003c/td>\u003ctd>Want an established brand\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Digital\u003c/td>\u003ctd>High\u003c/td>\u003ctd>Moderate to high\u003c/td>\u003ctd>Customers reachable online\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q7\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l8\">\u003ch2>8. Entrepreneurship in the Philippines\u003c/h2>\n\u003cp>Entrepreneurship is part of the historical and economic changes in the country. The slides walk through it era by era.\u003c/p>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Period\u003c/th>\u003cth>What happened\u003c/th>\u003cth>Entrepreneurship then\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Pre-Spanish\u003c/td>\u003ctd>Settlers came from Asia over land bridges; tribes lived by primitive agriculture (planting, gathering, hunting, fishing), later in groups under a leader\u003c/td>\u003ctd>Primitive\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Barter\u003c/td>\u003ctd>Goods exchanged without money. Trade with Arabs by the 10th century (silk for gold and pearls), then Chinese porcelain; locals traded handicrafts as far as Borneo, Malacca, China; goods paid as tax to the Ming Emperor; busy shores and river mouths became trading ports\u003c/td>\u003ctd>Exchange became a centuries-long practice\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Spanish (300+ years)\u003c/td>\u003ctd>\u003cb>Encomienda\u003c/b>: a crown grant giving a colonist the right to demand tribute and forced labor. Tobacco grown in the north for export. \u003cb>Galleon Trade\u003c/b> (Manila to Acapulco, 1565 to 1815) carried porcelain, silk, ivory, spices for New World silver. Bicol grew abaca for ship ropes\u003c/td>\u003ctd>Limited mainly to agriculture and colonial trade\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>American\u003c/td>\u003ctd>Economic imperialism: the country supplied raw materials (coconut, tobacco, sugar, abaca) and bought finished goods. \u003cb>Payne-Aldrich Tariff Act\u003c/b>: free entry to the US for Philippine products except rice, sugar, tobacco (rice taxed, quotas on sugar and tobacco)\u003c/td>\u003ctd>In foreign hands; the slides say the Chinese kept control of retail\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Japanese\u003c/td>\u003ctd>Japan wanted raw materials (copper, iron ore, forest products) and markets; war followed\u003c/td>\u003ctd>Standstill for about five years; exports on hold, money scarce\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Independent Republic\u003c/td>\u003ctd>Independence, then the 1946 \u003cb>Bell Trade Act\u003c/b> gave Americans rights over mining and utilities. Import and exchange controls helped local industry; Garcia's First Filipino policy ran about seven years; later \u003cb>decontrol\u003c/b> closed many local industries, causing job loss and strikes; World Bank and IMF loans over US$500 million\u003c/td>\u003ctd>Local business grew, then struggled against imports\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Marcos era\u003c/td>\u003ctd>Martial Law. WB-IMF loans of US$27 billion; reforms included import liberalization, tariff reduction, and \u003cb>export processing zones\u003c/b>\u003c/td>\u003ctd>Multinationals ran EPZ factories on minimum wages; growth was negative for several years\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Aquino\u003c/td>\u003ctd>People Power. Focus on jobs through EPZ industries and rural agriculture; land reform; remittances boosted growth\u003c/td>\u003ctd>New entrepreneurs, but cronies and opportunists remained\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ramos\u003c/td>\u003ctd>Built more power plants to ease the energy crisis\u003c/td>\u003ctd>Graft and corruption still blocked good programs\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Last decade (per slides)\u003c/td>\u003ctd>Business control stayed with a few who grew richer while hunger and unemployment continued; reforms must reach local government units\u003c/td>\u003ctd>The country is called a great ground for local entrepreneurship that must start now\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"fun\">\u003cb>Heads up:\u003c/b> the slides say Manuel Quezon was elected president of the new Republic in 1946. The first president of the independent republic was Manuel Roxas (Quezon led the earlier Commonwealth). Ask your teacher which to write on exams.\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q8\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l9\">\u003ch2>9. Global supply chain\u003c/h2>\n\u003cdiv class=\"def\">A \u003cb>supply chain\u003c/b> is a set of linked, interdependent entities that turn raw materials into finished products, connecting inbound activities (like purchasing) with outbound ones (logistics and “place”). A \u003cb>global supply chain\u003c/b> is the interrelated organizations, resources, and processes that create and deliver products and services to end customers, extended around the world. Any company using parts or services from an overseas factory faces global supply chain management.\u003c/div>\n\u003cp>\u003cb>Ford example:\u003c/b> in Europe, Belfast made carburetors, Enfield instruments and gauges, Basildon radiators and engine parts, Genk body panels, Cologne die-cast casings, Treforest spark plug insulators, and final assembly happened in Dagenham, Valencia, and Saarlouis.\u003c/p>\n\u003ch3>Forces driving globalization\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Force\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Global market\u003c/td>\u003ctd>Foreign competition at home, growing foreign demand, global presence as a defensive tool (Nestle, Kellogg's), being in leading markets (Japan electronics, Germany machine tools)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Technological\u003c/td>\u003ctd>Spread of knowledge, close ties with foreign suppliers, technology sharing, R&amp;D placed near production or expertise\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Global cost\u003c/td>\u003ctd>Low labor cost (declining importance), skilled labor, integrated supplier infrastructure, tax breaks, joint ventures, cost sharing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Political and economic\u003c/td>\u003ctd>Exchange rates, regional trade agreements, trade protection: tariffs, quotas, voluntary export limits, local content rules, health or environmental rules, government procurement policies\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>System components\u003c/h3>\n\u003cul class=\"eg\">\u003cli>\u003cb>International distribution:\u003c/b> manufacture at home, distribute overseas\u003c/li>\u003cli>\u003cb>International suppliers:\u003c/b> raw materials and parts from abroad, final assembly at home\u003c/li>\u003cli>\u003cb>Offshore manufacturing:\u003c/b> product made in one foreign location, shipped back for sale\u003c/li>\u003cli>\u003cb>Fully integrated global supply chain:\u003c/b> supplied, made, and distributed from factories around the world, designed to take advantage of national boundaries\u003c/li>\u003c/ul>\n\u003ch3>Sourcing strategies\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>Domestic\u003c/th>\u003cth>International\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Intra-firm (inside the company)\u003c/td>\u003ctd>Domestic in-house sourcing\u003c/td>\u003ctd>Offshore subsidiary sourcing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Outsourcing (independent suppliers)\u003c/td>\u003ctd>Domestic purchasing arrangement\u003c/td>\u003ctd>Offshore outsourcing\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>Competencies and factors\u003c/h3>\n\u003cp>\u003cb>Four competencies for efficient global SCM:\u003c/b> \u003ci>positioning\u003c/i> (choosing strategic approaches), \u003ci>integration\u003c/i> (deciding what to do and how, creatively), \u003ci>agility\u003c/i> (staying competitive and keeping customers successful), \u003ci>measurement\u003c/i> (monitoring operations internally and externally).\u003c/p>\n\u003cp>\u003cb>Factors to manage:\u003c/b> costs (labor rates, freight tariffs, exchange rates), customs duty, export regulations (denied-parties list, export licenses), time (lead, cycle, transit, license approval, customs clearance), corporate income taxes, and offset trade or local content rules.\u003c/p>\n\u003ch3>Moving from domestic to international\u003c/h3>\n\u003cp>Watch for: long distances, forecasting trouble in foreign markets, exchange-rate swings, demand for great product variety, and weak infrastructure (labor skills, supply, supplier quality, equipment, transport, telecom).\u003c/p>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Advantages\u003c/th>\u003cth>Disadvantages\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>More sales and profit chances; less dependence on the home economy; business at all hours online; room to expand; lower costs, shorter cycle time, more speed and efficiency; competitive advantage; untapped markets\u003c/td>\u003ctd>Heavy investment of time, money, resources; weak or undersized transport and distribution; market instability; hard to integrate and choose suppliers; needs cooperation and strategic fit among firms; gains may take years; extra staff, product changes for local culture, higher travel costs\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>Case:\u003c/b> a large computer company wanted to cut cost, improve return on assets (ROA), and simplify its worldwide chain. It cut plants from \u003cb>33 to 12\u003c/b> and made three customer-oriented zones (Americas, Europe, Pacific Rim). Estimated benefits: \u003cb>$375 million\u003c/b> lower manufacturing and logistics cost per year and ROA up \u003cb>3.2 points\u003c/b>.\u003c/p>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q9\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l10\">\u003ch2>10. SWOT and TOWS\u003c/h2>\n\u003cdiv class=\"def\">\u003cb>By the end you can:\u003c/b> tell internal from external factors, build a SWOT and a PESTLE with evidence, design practical strategic recommendations, and evaluate alternatives to justify a decision.\u003c/div>\n\u003cp>\u003cb>Starter challenge:\u003c/b> a campus print shop has long queues, rising paper costs, and a new competitor. What would you fix first? Think alone, then pair, then share.\u003c/p>\n\u003ch3>Case file: Campus Print Hub\u003c/h3>\n\u003cul class=\"eg\">\u003cli>Near classrooms, with knowledgeable student workers\u003c/li>\u003cli>Old printer and a limited equipment budget\u003c/li>\u003cli>Long queues and unreliable Wi-Fi\u003c/li>\u003cli>New competing shops and rising paper costs\u003c/li>\u003cli>Students want online ordering, but some still need paper\u003c/li>\u003c/ul>\n\u003ch3>Internal or external?\u003c/h3>\n\u003cdiv class=\"def\">\u003cb>Internal\u003c/b> = resources and processes inside the organization. \u003cb>External\u003c/b> = trends and actors outside its direct control.\u003cbr>Examples: printer speed is internal, inflation is external. Always explain how the condition affects performance.\u003c/div>\n\u003ch3>SWOT: the four-quadrant lens\u003c/h3>\n\u003cdiv class=\"swot\">\n\u003cdiv class=\"h\">\u003cb>Strengths\u003c/b>\u003csmall>Internal, helpful\u003c/small>\u003cp>Campus location; knowledgeable staff\u003c/p>\u003c/div>\n\u003cdiv class=\"x\">\u003cb>Weaknesses\u003c/b>\u003csmall>Internal, harmful\u003c/small>\u003cp>Slow equipment; no order management\u003c/p>\u003c/div>\n\u003cdiv class=\"h\">\u003cb>Opportunities\u003c/b>\u003csmall>External, helpful\u003c/small>\u003cp>Demand for faster digital pre-ordering\u003c/p>\u003c/div>\n\u003cdiv class=\"x\">\u003cb>Threats\u003c/b>\u003csmall>External, harmful\u003c/small>\u003cp>New competitors; paper-price increases\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"fun\">\u003cb>Do not confuse an external threat with an internal weakness.\u003c/b> A competitor opening nearby is a threat. A slow printer is a weakness.\u003c/div>\n\u003ch3>From SWOT to strategy: TOWS\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Pair\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example for the case\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>SO\u003c/td>\u003ctd>Use strengths to exploit opportunities\u003c/td>\u003ctd>Use the campus location and knowledgeable staff to launch online pre-orders\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>WO\u003c/td>\u003ctd>Fix weaknesses by using opportunities\u003c/td>\u003ctd>Use demand for digital ordering to fix the lack of order management\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ST\u003c/td>\u003ctd>Use strengths to mitigate threats\u003c/td>\u003ctd>Use convenience and staff knowledge to keep students from new shops\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>WT\u003c/td>\u003ctd>Reduce weaknesses and exposure to threats\u003c/td>\u003ctd>Cut paper use with double-sided printing while the old printer is replaced\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q10\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l11\">\u003ch2>11. PESTLE and how it connects to SWOT\u003c/h2>\n\u003cp>PESTLE scans the wider environment around a business, so you do not miss outside forces.\u003c/p>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>Factor\u003c/th>\u003cth>Look at\u003c/th>\u003cth>Case example\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>P\u003c/td>\u003ctd>Political\u003c/td>\u003ctd>Public policy and priorities\u003c/td>\u003ctd>Ask: do campus or government rules affect the shop?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>E\u003c/td>\u003ctd>Economic\u003c/td>\u003ctd>Prices and purchasing power\u003c/td>\u003ctd>Inflation increases the cost per print\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>S\u003c/td>\u003ctd>Social\u003c/td>\u003ctd>Habits and preferences\u003c/td>\u003ctd>Students prefer convenient pickup\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>T\u003c/td>\u003ctd>Technological\u003c/td>\u003ctd>Tools and innovation\u003c/td>\u003ctd>Online forms support pre-orders\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>L\u003c/td>\u003ctd>Legal\u003c/td>\u003ctd>Laws and compliance\u003c/td>\u003ctd>Protect information collected from customers\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>E\u003c/td>\u003ctd>Environmental\u003c/td>\u003ctd>Waste and sustainability\u003c/td>\u003ctd>Double-sided print options reduce waste\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>How SWOT and PESTLE connect\u003c/h3>\n\u003col class=\"eg\">\u003cli>PESTLE identifies external, big-picture drivers.\u003c/li>\u003cli>Translate each relevant driver into a SWOT Opportunity or Threat.\u003c/li>\u003cli>SWOT also tests your internal Strengths and Weaknesses against those drivers.\u003c/li>\u003cli>Convert the insights into realistic, prioritized actions.\u003c/li>\u003c/ol>\n\u003cdiv class=\"fun\">\u003cb>Practice (10 minutes):\u003c/b> choose three PESTLE trends. For each one, describe the trend, explain its effect on the shop, and label it an Opportunity or a Threat. Do not list labels without explaining the impact.\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q11\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l12\">\u003ch2>12. From analysis to decision\u003c/h2>\n\u003ch3>The strategic planning cycle\u003c/h3>\n\u003col class=\"eg\">\u003cli>Define direction and measurable goals\u003c/li>\u003cli>Assess conditions with SWOT and PESTLE\u003c/li>\u003cli>Generate and prioritize strategic options\u003c/li>\u003cli>Assign owners, resources, timelines, and KPIs\u003c/li>\u003cli>Implement, measure, adjust\u003c/li>\u003c/ol>\n\u003ch3>SMART goals: before and after\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Vague\u003c/th>\u003cth>SMART\u003c/th>\u003c/tr>\u003ctr>\u003ctd>“Improve customer service.”\u003c/td>\u003ctd>“Reduce average waiting time from 20 to 10 minutes in 8 weeks with a ₱5,000 pilot budget.”\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>SMART means Specific, Measurable, Achievable, Relevant, Time-bound. Ask yourself: what would you measure every week?\u003c/p>\n\u003ch3>Problem-solving is not choosing blindly\u003c/h3>\n\u003col class=\"eg\">\u003cli>Identify the goal and the performance gap\u003c/li>\u003cli>Diagnose possible root causes, not just symptoms\u003c/li>\u003cli>Generate multiple feasible alternatives\u003c/li>\u003cli>Agree on decision criteria and constraints\u003c/li>\u003cli>Evaluate, select, implement, review\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Symptom or root cause?\u003c/b> Students waiting 20 minutes is an observable \u003cb>symptom\u003c/b>. Possible causes: manual orders, printer downtime, demand spikes. Investigate before buying a new printer, and ask what evidence would confirm the cause.\u003c/p>\n\u003ch3>Compare the alternatives\u003c/h3>\n\u003cp>A: pilot a free mobile pre-order form. B: purchase another printer. C: schedule pickup windows. Criteria: student impact, cost, feasibility, speed.\u003c/p>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Weighted decision matrix: change any number\u003c/div>\n\u003cdiv class=\"wide\">\u003ctable id=\"mx\" style=\"min-width:560px\">\u003ctr>\u003cth>Criterion\u003c/th>\u003cth>Weight %\u003c/th>\u003cth>Online form\u003c/th>\u003cth>New printer\u003c/th>\u003cth>Pickup times\u003c/th>\u003c/tr>\n\u003ctr class=\"r\">\u003ctd>Impact\u003c/td>\u003ctd>\u003cinput class=\"w\" type=\"number\" value=\"40\" min=\"0\" max=\"100\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"5\" min=\"1\" max=\"5\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"4\" min=\"1\" max=\"5\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"3\" min=\"1\" max=\"5\">\u003c/td>\u003c/tr>\n\u003ctr class=\"r\">\u003ctd>Affordability\u003c/td>\u003ctd>\u003cinput class=\"w\" type=\"number\" value=\"25\" min=\"0\" max=\"100\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"5\" min=\"1\" max=\"5\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"1\" min=\"1\" max=\"5\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"5\" min=\"1\" max=\"5\">\u003c/td>\u003c/tr>\n\u003ctr class=\"r\">\u003ctd>Feasibility\u003c/td>\u003ctd>\u003cinput class=\"w\" type=\"number\" value=\"20\" min=\"0\" max=\"100\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"4\" min=\"1\" max=\"5\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"3\" min=\"1\" max=\"5\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"5\" min=\"1\" max=\"5\">\u003c/td>\u003c/tr>\n\u003ctr class=\"r\">\u003ctd>Speed\u003c/td>\u003ctd>\u003cinput class=\"w\" type=\"number\" value=\"15\" min=\"0\" max=\"100\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"5\" min=\"1\" max=\"5\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"2\" min=\"1\" max=\"5\">\u003c/td>\u003ctd>\u003cinput class=\"s\" type=\"number\" value=\"4\" min=\"1\" max=\"5\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Total\u003c/b>\u003c/td>\u003ctd id=\"mw\">\u003c/td>\u003ctd id=\"t0\">\u003c/td>\u003ctd id=\"t1\">\u003c/td>\u003ctd id=\"t2\">\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp id=\"mxmsg\" aria-live=\"polite\">\u003c/p>\n\u003cp style=\"font-size:15px;color:var(--mute)\">Scores are 1 to 5 examples. Total = sum of (weight × score). Results change with evidence and assumptions. Note: the original slide shows 4.10 for Pickup times, but the sum works out to 4.05.\u003c/p>\u003c/div>\n\u003cdiv class=\"def\">\u003cb>Recommendation, evidence, KPI:\u003c/b> pilot online pre-orders, keep walk-in access, and minimize collected customer data. Track waiting time, order errors, and uptake each week. \u003cb>A high score does not override privacy, safety, or feasibility constraints.\u003c/b>\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q12\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l13\">\u003ch2>13. Practice cases\u003c/h2>\n\u003cp>Try answering out loud first, as in an oral assessment.\u003c/p>\n\u003ch3>Case: Maria\u003c/h3>\n\u003cp>Maria, a college student, sells homemade pastries online. Customers ask for many flavors, a supplier raises ingredient prices, some customers cancel, and a rival sells similar items cheaper. What characteristics, competencies, and recommendations help her?\u003c/p>\n\u003cp>\u003ci>Possible answer:\u003c/i> persistence and adaptability (keep going, adjust); calculated risk (test two or three new flavors in small batches); problem-solving and decision-making (compare suppliers, recompute prices); communication (tell customers about changes, ask why orders were canceled); goal setting (for example, regain a set number of weekly orders). Differentiate on quality and flavors rather than only on price.\u003c/p>\n\u003ch3>More oral questions\u003c/h3>\n\u003cul class=\"eg\">\u003cli>Can a person be entrepreneurial without owning a business? Explain.\u003c/li>\u003cli>Why take calculated risks instead of avoiding all risks?\u003c/li>\u003cli>Which organization type suits a farmers' group, and why?\u003c/li>\u003cli>Which entrepreneurship model fits a team inside a bank that builds a new app?\u003c/li>\u003cli>Which competency are you strongest in, and which do you need to improve most?\u003c/li>\u003c/ul>\n\u003ch3>Final case study: Campus Print Hub\u003c/h3>\n\u003cp>Work in a team and deliver all five parts:\u003c/p>\n\u003cul class=\"eg\">\u003cli>A SWOT and a PESTLE with evidence from the case\u003c/li>\u003cli>Two TOWS strategies and one SMART goal\u003c/li>\u003cli>A comparison of three alternatives using criteria you choose\u003c/li>\u003cli>A recommendation, plus one risk\u003c/li>\u003cli>A KPI and a date for reviewing success\u003c/li>\u003c/ul>\n\u003ch3>Exit ticket (individual, 5 minutes)\u003c/h3>\n\u003cul class=\"eg\">\u003cli>Give one external threat and one internal weakness. What is the difference?\u003c/li>\u003cli>Which PESTLE trend becomes an opportunity?\u003c/li>\u003cli>Which alternative do you choose, and why?\u003c/li>\u003cli>What KPI will prove that it worked?\u003c/li>\u003c/ul>\n\u003cdiv class=\"fun\">\u003cb>Key takeaway:\u003c/b> analysis tells us what is happening, strategy tells us what we should do, and evaluation helps us choose and improve. Evidence, then action, then measurement.\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q13\">\u003c/div>\u003c/div>\u003c/section>\n\u003c/main>\n\n\u003cscript>\nconst T=[\"What is it\",\"Mindset\",\"Traits & skills\",\"Types & challenges\",\"Organizations\",\"Businesses\",\"Models\",\"Philippines\",\"Supply chain\",\"SWOT & TOWS\",\"PESTLE\",\"Decisions\",\"Practice\"];\ndocument.getElementById(\"nav\").innerHTML=T.map((t,i)=>`\u003ca class=\"chip\" href=\"#l${i+1}\">${i+1}. ${t}\u003c/a>`).join(\"\");\nconst QS={\nq1:[[\"Selling becomes entrepreneurial when it involves…\",[\"Only low prices\",\"Opportunity recognition, planning, innovation, calculated risk, value creation\",\"Owning a large company\"],1,\"Those elements separate entrepreneurship from ordinary selling.\"],\n[\"Which is an example of resource organization?\",[\"Surveying customers\",\"Using classmates' skills to run an online store\",\"Keeping costs low\"],1,\"Resource organization means combining people, money, materials, and technology.\"],\n[\"Can someone be entrepreneurial without owning a business?\",[\"Yes\",\"No\"],0,\"Entrepreneurship is a way of acting on opportunities, not only ownership.\"]],\nq2:[[\"Creativity vs innovation: which is correct?\",[\"Innovation is thinking of an idea; creativity is applying it\",\"Creativity is generating a useful idea; innovation is applying it\",\"They mean the same\"],1,\"A creative idea becomes an innovation once it is implemented.\"],\n[\"The milk-tea shop adds low-sugar fruit drinks. Which trait is shown?\",[\"Adaptability\",\"Resilience only\",\"Customer orientation only\"],0,\"It adjusts to a changing customer trend.\"],\n[\"Paying workers fairly and protecting customer data show…\",[\"Ethical and social responsibility\",\"Initiative\",\"Opportunity recognition\"],0,\"Decisions should consider employees, customers, community, and environment.\"]],\nq3:[[\"Characteristics describe…\",[\"What an entrepreneur can do\",\"Who an entrepreneur is\",\"The type of business\"],1,\"Competencies describe what they can do.\"],\n[\"Which is a calculated risk?\",[\"Launching big with no testing\",\"Testing a product and estimating expenses first\",\"Avoiding all decisions\"],1,\"Calculated risk = research + planning.\"],\n[\"Which is a strong goal?\",[\"Sell more someday\",\"Increase monthly online sales by 15% in three months\",\"Be successful\"],1,\"A strong goal is specific and has a deadline.\"]],\nq4:[[\"A milk-tea shop with local flavors and cheaper prices is…\",[\"Innovative\",\"Imitative\",\"Social\"],1,\"It adopts an existing idea and improves or adapts it.\"],\n[\"A recycling livelihood project is mostly…\",[\"Social\",\"Imitative\",\"Small business only\"],0,\"It tackles a community problem while staying sustainable.\"],\n[\"How should entrepreneurs treat failure?\",[\"Hide it\",\"As information for improvement\",\"As proof to quit\"],1,\"Failure shows what went wrong and what to fix.\"]],\nq5:[[\"Which form has limited liability and continues despite ownership changes?\",[\"Sole proprietorship\",\"Corporation\",\"Partnership\"],1,\"A corporation is a separate legal entity.\"],\n[\"A farmers' group with democratic control is a…\",[\"Cooperative\",\"Corporation\",\"Nonprofit\"],0,\"Members own and democratically control it.\"],\n[\"Can a nonprofit earn revenue?\",[\"Yes, but not distribute profits to private owners\",\"No, never\",\"Only through loans\"],0,\"Surplus supports its mission.\"]],\nq6:[[\"Selling laptops is…\",[\"Merchandising\",\"Manufacturing\",\"Service\"],0,\"Buying finished goods and reselling them is merchandising.\"],\n[\"A bakery that bakes, sells, and caters is…\",[\"Service\",\"Hybrid\",\"Merchandising\"],1,\"It combines business types.\"],\n[\"Mobile apps and online courses are…\",[\"Goods\",\"Digital products\",\"Experiences\"],1,\"They are created, delivered, and used electronically.\"]],\nq7:[[\"Which model has the highest growth potential and funding needs?\",[\"Small business\",\"Scalable startup\",\"Franchise\"],1,\"Rapid growth, high uncertainty, substantial funding.\"],\n[\"A team inside a bank builds a new banking app. This is…\",[\"Intrapreneurship\",\"Franchise\",\"Social\"],0,\"Innovation inside an existing organization.\"],\n[\"Franchise: strength and challenge?\",[\"Known brand, but fees and less independence\",\"No fees, full freedom\",\"Cybersecurity risk\"],0,\"You get a tested concept but follow franchisor rules.\"]],\nq8:[[\"What was the Galleon Trade route?\",[\"Manila to Acapulco\",\"Manila to Beijing\",\"Cebu to Madrid\"],0,\"It ran from 1565 to 1815.\"],\n[\"What is an encomienda?\",[\"A trade tax\",\"A grant to demand tribute and forced labor\",\"A type of ship\"],1,\"Granted by the Spanish crown to colonists.\"],\n[\"Which law gave Americans rights over mining and utilities in 1946?\",[\"Bell Trade Act\",\"Payne-Aldrich Act\",\"Decontrol Act\"],0,\"Imposed right after independence.\"]],\nq9:[[\"Which is NOT one of the four forces driving globalization?\",[\"Global market forces\",\"Technological forces\",\"Religious forces\"],2,\"The four: market, technological, cost, political and economic.\"],\n[\"Buying major components from independent overseas suppliers is…\",[\"Offshore outsourcing\",\"Domestic in-house sourcing\",\"Offshore subsidiary sourcing\"],0,\"Outsourcing plus international.\"],\n[\"The computer company cut its plants from…\",[\"33 to 12\",\"12 to 33\",\"50 to 5\"],0,\"Estimated savings of $375 million a year.\"]],\nq10:[[\"Inflation pushing up paper costs is…\",[\"An internal weakness\",\"An external threat\",\"A strength\"],1,\"It is outside the shop's control and harmful, so it is an external threat.\"],\n[\"The shop's old, slow printer is…\",[\"An external threat\",\"An opportunity\",\"An internal weakness\"],2,\"It is inside the organization and harmful.\"],\n[\"Using the campus location and knowledgeable staff to launch online pre-orders is which TOWS pair?\",[\"SO\",\"WT\",\"ST\"],0,\"Use strengths to exploit an opportunity.\"]],\nq11:[[\"Which PESTLE letter covers laws and compliance?\",[\"L\",\"P\",\"E\"],0,\"L is Legal, for example protecting customer information.\"],\n[\"Students preferring convenient pickup is a…\",[\"Social trend\",\"Legal rule\",\"Technological tool\"],0,\"Habits and preferences are social factors.\"],\n[\"After a PESTLE scan, each relevant trend should be turned into…\",[\"A strength or weakness\",\"A SWOT opportunity or threat\",\"A KPI directly\"],1,\"External drivers become Opportunities or Threats, with the impact explained.\"]],\nq12:[[\"Students wait 20 minutes. This is a…\",[\"Root cause\",\"Symptom\",\"Solution\"],1,\"It is what you observe. Investigate the cause before buying equipment.\"],\n[\"Which is a SMART goal?\",[\"Improve customer service\",\"Cut average waiting from 20 to 10 minutes in 8 weeks\",\"Be the best print shop\"],1,\"It is specific, measurable, time-bound, and has a budget.\"],\n[\"A high matrix score for an option that breaks privacy rules means…\",[\"Choose it anyway\",\"It does not override privacy, safety, or feasibility constraints\",\"Ignore the criteria\"],1,\"Constraints come first.\"]],\nq13:[[\"Maria's rival sells cheaper. A good response is…\",[\"Quit immediately\",\"Differentiate on quality and flavors, and test changes\",\"Ignore all feedback\"],1,\"Adapt with calculated, tested changes.\"],\n[\"Which competency helps Maria compare suppliers and recompute prices?\",[\"Problem-solving and decision-making\",\"Fear of failure\",\"Franchising\"],0,\"She is using information to decide.\"]]};\nObject.keys(QS).forEach(id=>{\n const box=document.getElementById(id);\n QS[id].forEach(([q,opts,ans,why])=>{\n  const d=document.createElement(\"div\");d.className=\"q\";\n  d.innerHTML=`\u003cdiv>\u003c/div>\u003cdiv class=\"o\">\u003c/div>\u003cdiv class=\"why\" aria-live=\"polite\">\u003c/div>`;\n  d.firstChild.textContent=q;\n  const o=d.querySelector(\".o\"),w=d.querySelector(\".why\");\n  opts.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;\n   b.onclick=()=>{[...o.children].forEach(x=>x.className=\"\");b.className=i===ans?\"good\":\"bad\";w.textContent=(i===ans?\"Correct. \":\"Not quite. \")+why};o.appendChild(b)});\n  box.appendChild(d);\n });\n});\n\n(function(){\n const names=[\"Online form\",\"New printer\",\"Pickup times\"];\n function calc(){\n  const rs=[...document.querySelectorAll(\"#mx tr.r\")],tot=[0,0,0];let ws=0;\n  rs.forEach(r=>{const w=+r.querySelector(\".w\").value||0;ws+=w;r.querySelectorAll(\".s\").forEach((i,k)=>{tot[k]+=w/100*(+i.value||0)})});\n  document.getElementById(\"mw\").textContent=ws+\"%\";\n  tot.forEach((t,k)=>document.getElementById(\"t\"+k).textContent=t.toFixed(2));\n  const best=tot.indexOf(Math.max(...tot));\n  document.getElementById(\"mxmsg\").textContent=(ws===100?\"\":\"Weights add up to \"+ws+\"%, not 100%. \")+\"Highest total: \"+names[best]+\" (\"+tot[best].toFixed(2)+\").\";\n }\n document.querySelectorAll(\"#mx input\").forEach(i=>i.addEventListener(\"input\",calc));\n calc();\n})();\n\u003c/script>\n\u003cscript>(function(){\n var secs=[].slice.call(document.querySelectorAll(\"main section\"));\n secs.forEach(function(s,i){\n  var h=s.querySelector(\"h2\"),m=h.textContent.match(/^(\\d+)\\.\\s*(.*)$/);\n  if(m){h.innerHTML='\u003cspan class=\"num\">\u003c/span>\u003cspan>\u003c/span>';h.firstChild.textContent=m[1];h.lastChild.textContent=m[2];}\n  var pg=document.createElement(\"div\");pg.className=\"pager\";\n  pg.innerHTML=(i?'\u003ca href=\"#'+secs[i-1].id+'\">\\u2190 Previous\u003c/a>':\"\u003cspan>\u003c/span>\" (function(){
