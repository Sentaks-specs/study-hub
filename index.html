f5dff)}\n.part.p2{background:linear-gradient(135deg,#0b4a52,#12805c)}\n.part h1{color:#fff;margin:0 0 6px;font-size:clamp(28px,7vw,40px)}\n.part p{color:rgba(255,255,255,.88);margin:6px 0 0}\nsection{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px 26px;margin-top:34px;box-shadow:0 2px 0 var(--line),0 14px 30px -22px rgba(20,33,61,.5)}\nsection.p2{--a:#0f8f7a;--tint:#e0f4ef}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) section.p2{--a:#4fd1a1;--tint:#17342f}}\n:root[data-theme=\"dark\"] section.p2{--a:#4fd1a1;--tint:#17342f}\nsection h2{display:flex;align-items:center;gap:14px;font-size:clamp(24px,5.4vw,31px);line-height:1.2;margin:0 0 26px}\n.num{flex:none;display:inline-grid;place-items:center;min-width:46px;height:46px;border-radius:13px;background:var(--a);color:var(--card);font-size:21px}\nsection p{margin:0 0 20px}\nsection h3{font-size:22px;margin:40px 0 12px}\nsection ul,section ol{margin:0 0 20px}\nsection li{margin:8px 0}\n.def{background:var(--tint);border-left:6px solid var(--a);border-radius:0 16px 16px 0;padding:18px 22px;margin:26px 0}\n.fun{background:transparent;border:1.5px dashed var(--a);border-radius:16px;padding:16px 20px;margin:28px 0;font-size:.95em;line-height:1.75}\n.slide{background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px;margin:28px 0}\n.slide .k{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}\n.topic{border:1.5px solid var(--line);border-radius:20px;padding:10px 22px 18px;margin-top:30px;background:var(--bg)}\n.topic h3{display:flex;align-items:center;gap:14px;font-size:24px;margin:12px 0 16px}\n.topic .sy{display:inline-grid;place-items:center;min-width:50px;height:50px;padding:0 10px;border-radius:14px;background:var(--a);color:var(--card);font-size:22px;margin:0;flex:none}\n.topic .def,.topic .fun{background-clip:padding-box}\n.wide{border:1.5px solid var(--line);border-radius:14px;margin:22px 0}\n.wide table{margin:0;border-collapse:collapse}\nth{padding:12px 14px;background:var(--tint);color:var(--ink);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}\ntd{padding:13px 14px;font-size:16.5px;line-height:1.6}\ntr:nth-child(even) td{background:rgba(127,147,190,.07)}\ntr:last-child td{border-bottom:none}\ncode,.m{padding:3px 9px;font-size:.88em}\n.ex{display:block;margin-top:6px;padding:10px 14px;border-radius:10px;font-size:15.5px}\n.q{padding:18px 0}\nbutton{padding:10px 17px;margin:6px 8px 6px 0;border-radius:10px}\n.why{font-size:16px;margin-top:8px;line-height:1.6}\ndetails{padding:12px 18px;border-radius:14px;margin:20px 0}\ndetails p{margin:10px 0 4px}\n.drill .it{padding:12px 0}\n.fig{margin:26px 0 10px}\n.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:38px;padding-top:20px;border-top:1.5px solid var(--line)}\n.pager a{font:700 15px \"Space Grotesk\",sans-serif;color:var(--a);text-decoration:none;padding:10px 16px;border:1.5px solid var(--a);border-radius:12px}\n.chip.on{background:var(--ink);color:var(--bg)}\n#bar{position:fixed;left:0;top:0;height:4px;width:0;background:linear-gradient(90deg,#2f5dff,#12a37f);z-index:20;transition:width .1s}\n@media(max-width:520px){section{padding:26px 18px 20px;border-radius:18px}.topic{padding:6px 16px 14px}.part{padding:24px 20px}}\n.kws{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0 26px}\n.kw{background:var(--bg);border:1.5px solid var(--line);border-left:6px solid var(--a);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}\n.kw b{font:700 18px \"Space Grotesk\",sans-serif}\n.kw span{font-size:16px;line-height:1.55;color:var(--mute);transition:filter .15s}\n.testing .kw{cursor:pointer}\n.testing .kw:not(.show) span{filter:blur(7px);user-select:none}\n.syms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 22px}\n.sm{background:var(--tint);border-radius:14px;padding:14px 12px;text-align:center}\n.sm i{display:block;font:700 28px \"Space Grotesk\",sans-serif;font-style:normal;color:var(--a);margin-bottom:4px}\n.sm span{font-size:14.5px;line-height:1.4}\n.tst{background:var(--ink);color:var(--bg);margin:6px 0 4px}\n.testing .tst{background:var(--a);color:var(--card);border-color:var(--a)}\n.hint{font-size:14.5px;color:var(--mute);margin:4px 0 6px}\nsection.recap{border:2px solid var(--a)}\nsection.recap h2 .num{border-radius:50%}\n\n/* symbol sheet */\n.symgrid .kw{flex-direction:row;align-items:flex-start;gap:16px}\n.symgrid .kw b{flex:none;min-width:62px;text-align:center;font-size:28px;color:var(--a);line-height:1.2}\n.symgrid .kw span{line-height:1.6;color:var(--mute)}\n.symgrid .kw strong{color:var(--ink);font-family:\"Space Grotesk\",sans-serif}\n\n/* ready for a Part 3: add \u003cdiv class=\"part\"> then sections and it picks this up */\nsection.p3{--a:#c2570c;--tint:#fdeee0}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) section.p3{--a:#ffa65c;--tint:#3a2a1c}}\n:root[data-theme=\"dark\"] section.p3{--a:#ffa65c;--tint:#3a2a1c}\n.part.p3{background:linear-gradient(135deg,#7a3b0c,#d9731a)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003cdiv class=\"eyebrow\">Discrete mathematics reader\u003c/div>\n\u003ch1>Sets, relations and functions\u003c/h1>\n\u003cp class=\"lead\">Your discrete math reader in two parts. Part 1 is sets: every special set and every operation, one at a time. Part 2 is relations and functions, which builds directly on sets. Read in order, and do the quizzes to check yourself.\u003c/p>\n\u003cdiv class=\"sizer\">Text size \u003cbutton id=\"fs-\" aria-label=\"Smaller text\">A−\u003c/button>\u003cbutton id=\"fs+\" aria-label=\"Larger text\">A+\u003c/button>\u003c/div>\n\u003cdiv class=\"how\" id=\"how\">\u003c/div>\n\u003cdiv class=\"part\">\u003ch1>Part 1: Sets\u003c/h1>\u003cp>From the basic idea of a set to every special set and operation, one at a time.\u003c/p>\u003c/div>\n\n\n\n\u003csection id=\"l1\" data-nav=\"What is a set\">\u003ch2>What is a set?\u003c/h2>\n\u003cdiv class=\"def\">\u003cb>Set:\u003c/b> a collection of objects, called \u003cb>elements\u003c/b> or \u003cb>members\u003c/b>.\u003cbr>\u003cb>Well-defined set:\u003c/b> a set where you can always tell for sure whether something belongs. The elements share a clear common characteristic.\u003c/div>\n\u003cp>“The vowels in English” is well-defined: a, e, i, o, u, and nothing else. “Delicious foods” is \u003ci>not\u003c/i> well-defined, because people disagree on what counts. “Tall students” fails too, since nobody agrees on how tall is tall.\u003c/p>\n\u003cp>Two more rules: a set does not care about \u003cb>order\u003c/b>, and listing something twice changes nothing. \u003cspan class=\"m\">{1, 2, 3} = {3, 1, 2, 2}\u003c/span>\u003c/p>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q1\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l2\" data-nav=\"Naming sets\">\u003ch2>Naming and writing sets\u003c/h2>\n\u003cp>We name sets with capital letters and write the elements inside braces. There are two ways to write a set.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Way\u003c/th>\u003cth>Looks like\u003c/th>\u003cth>Use when\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Roster (listing)\u003c/td>\u003ctd>\u003ccode>A = {2, 4, 6, 8}\u003c/code>\u003c/td>\u003ctd>The set is short\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rule (set-builder)\u003c/td>\u003ctd>\u003ccode>A = {x | x is an even number less than 10, x &gt; 0}\u003c/code>\u003c/td>\u003ctd>The set is long or infinite\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>Read \u003ccode>|\u003c/code> as “such that”. A long set uses three dots: \u003ccode>{1, 2, 3, …, 100}\u003c/code>. An infinite set uses dots at the end: \u003ccode>{1, 2, 3, …}\u003c/code>.\u003c/p>\n\u003ch3>Sets you should know by name\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Name\u003c/th>\u003cth>Elements\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Counting (natural) numbers\u003c/td>\u003ctd>{1, 2, 3, 4, …}\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Whole numbers\u003c/td>\u003ctd>{0, 1, 2, 3, …}\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Integers\u003c/td>\u003ctd>{…, −2, −1, 0, 1, 2, …}\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Even numbers\u003c/td>\u003ctd>{…, −4, −2, 0, 2, 4, …}\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Odd numbers\u003c/td>\u003ctd>{…, −3, −1, 1, 3, 5, …}\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Prime numbers\u003c/td>\u003ctd>{2, 3, 5, 7, 11, 13, …}\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Vowels\u003c/td>\u003ctd>{a, e, i, o, u}\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Days of the week\u003c/td>\u003ctd>{Mon, Tue, Wed, Thu, Fri, Sat, Sun}\u003c/td>\u003c/tr>\u003c/table>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q2\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l3\" data-nav=\"∈ and ∉\">\u003ch2>Element of, not element of\u003c/h2>\n\u003cp>\u003cspan class=\"m\">∈\u003c/span> means “is an element of”. \u003cspan class=\"m\">∉\u003c/span> means “is not an element of”.\u003c/p>\n\u003cp>If \u003ccode>A = {even numbers}\u003c/code>, then \u003ccode>8 ∈ A\u003c/code> and \u003ccode>7 ∉ A\u003c/code>. Always compare an \u003ci>element\u003c/i> with a \u003ci>set\u003c/i>. Elements go on the left, sets go on the right.\u003c/p>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Worked example\u003c/div>\n\u003cp>A = {even numbers}, B = {odd numbers}, C = {counting numbers}\u003c/p>\n\u003cp>2 \u003cb>∈\u003c/b> A (2 is even) &nbsp; 8 \u003cb>∉\u003c/b> B (8 is not odd) &nbsp; 7 \u003cb>∈\u003c/b> C (7 is a counting number) &nbsp; −2 \u003cb>∉\u003c/b> C (counting numbers start at 1)\u003c/p>\u003c/div>\n\u003cdiv class=\"slide drill\">\u003cdiv class=\"k\">Practice: fill in the blanks with ∈ or ∉\u003c/div>\n\u003cdiv id=\"defs\" style=\"font-family:'Space Grotesk',sans-serif\">\u003c/div>\u003cdiv id=\"items\">\u003c/div>\n\u003cbutton id=\"chk\">Check answers\u003c/button>\u003cbutton id=\"newd\">New problems\u003c/button>\u003cdiv class=\"score\" id=\"sc\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l4\" data-nav=\"Subsets\">\u003ch2>Subsets\u003c/h2>\n\u003cdiv class=\"def\">\u003cb>A ⊆ B\u003c/b> (A is a subset of B) when every element of A is also in B.\u003cbr>\u003cb>A ⊂ B\u003c/b> (proper subset) when A ⊆ B and B has at least one extra element.\u003c/div>\n\u003cp>Counting numbers are a subset of whole numbers, which are a subset of integers: \u003ccode>C ⊂ W ⊂ Z\u003c/code>. Even numbers and odd numbers are both subsets of the integers, but neither is a subset of the other.\u003c/p>\n\u003cp>Two facts that surprise people: every set is a subset of itself, and the empty set is a subset of every set. A set with n elements has \u003cb>2ⁿ\u003c/b> subsets.\u003c/p>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q4\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l5\" data-nav=\"Special sets\">\u003ch2>Special sets\u003c/h2>\n\u003cp>Some sets are so common they get their own names. Meet all eight, one at a time. Each has its own idea, examples, and a fun fact.\u003c/p>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">∅\u003c/span>The empty set\u003c/h3>\n\u003cdiv class=\"def\">A set with \u003cb>no elements\u003c/b>. Written \u003ccode>∅\u003c/code> or \u003ccode>{ }\u003c/code>, and \u003ccode>n(∅) = 0\u003c/code>.\u003c/div>\n\u003cp>Think of an empty box. The box exists, but nothing is inside. Sets that turn out empty:\u003c/p>\n\u003cul class=\"eg\">\u003cli>{months with 40 days}\u003c/li>\u003cli>{counting numbers less than 1}\u003c/li>\u003cli>{whole numbers less than 0}\u003c/li>\u003cli>{students who are 10 meters tall}\u003c/li>\u003c/ul>\n\u003cp>There is only \u003cb>one\u003c/b> empty set, no matter how you describe it. It is a subset of every set.\u003c/p>\n\u003cp>\u003cb>Common trap:\u003c/b> \u003ccode>{0}\u003c/code> and \u003ccode>{∅}\u003c/code> are \u003ci>not\u003c/i> empty. Each holds one element (the number 0, and the empty set).\u003c/p>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> If you have written Luau, an empty table \u003ccode>{}\u003c/code> is a good picture of it. An empty table inside another table, \u003ccode>{{}}\u003c/code>, is like \u003ccode>{∅}\u003c/code>: the outer one is no longer empty.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">{a}\u003c/span>Singleton set\u003c/h3>\n\u003cdiv class=\"def\">A set with \u003cb>exactly one element\u003c/b>. \u003ccode>n = 1\u003c/code>.\u003c/div>\n\u003cul class=\"eg\">\u003cli>{even prime numbers} = {2}\u003c/li>\u003cli>{the capital of the Philippines} = {Manila}\u003c/li>\u003cli>{x | x is a whole number less than 1} = {0}\u003c/li>\u003c/ul>\n\u003cp>Be careful: \u003ccode>5\u003c/code> is an element, \u003ccode>{5}\u003c/code> is a set. So \u003ccode>5 ∈ {5}\u003c/code> is true, but \u003ccode>5 = {5}\u003c/code> is not. A singleton has exactly two subsets: ∅ and itself.\u003c/p>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> 2 is the only even prime number. Every other even number can be divided by 2, so it has more than two factors.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">U\u003c/span>Universal set\u003c/h3>\n\u003cdiv class=\"def\">The set of \u003cb>everything we are talking about\u003c/b> in one problem. Every other set in that problem is a subset of U.\u003c/div>\n\u003cp>U depends on the situation. If you study digits, \u003ccode>U = {0,1,2,…,9}\u003c/code>. If you study your class, U is all your classmates. The same set can mean different things under different universes.\u003c/p>\n\u003cul class=\"eg\">\u003cli>A = {1, 2, 3}, U = {1,…,5} gives A′ = {4, 5}\u003c/li>\u003cli>A = {1, 2, 3}, U = {1,…,10} gives A′ = {4,…,10}\u003c/li>\u003c/ul>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> There is no single “set of everything” used for all of math. You choose U for the job, which is why complements always need one.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">n\u003c/span>Finite set\u003c/h3>\n\u003cdiv class=\"def\">A set where counting \u003cb>eventually ends\u003c/b>, so \u003ccode>n(A)\u003c/code> is an ordinary whole number.\u003c/div>\n\u003cul class=\"eg\">\u003cli>{vowels}, n = 5\u003c/li>\u003cli>{days of the week}, n = 7\u003c/li>\u003cli>{whole numbers less than 1,000,000}, n = 1,000,000\u003c/li>\u003c/ul>\n\u003cp>Big does not mean infinite. Every grain of sand on Earth is a finite set, even if nobody could count it.\u003c/p>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> The empty set counts as finite, with n = 0.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">∞\u003c/span>Infinite set\u003c/h3>\n\u003cdiv class=\"def\">A set where counting \u003cb>never ends\u003c/b>. You show it with dots: \u003ccode>{1, 2, 3, …}\u003c/code>.\u003c/div>\n\u003cul class=\"eg\">\u003cli>{counting numbers}\u003c/li>\u003cli>{integers}\u003c/li>\u003cli>{even numbers}\u003c/li>\u003cli>{multiples of 5}\u003c/li>\u003c/ul>\n\u003cp>You cannot write every element, so you use the dots or a rule like \u003ccode>{x | x is a multiple of 5}\u003c/code>.\u003c/p>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> There are “as many” even numbers as counting numbers. Pair them off: 1↔2, 2↔4, 3↔6, and so on. Nothing is left over on either side, even though the evens are only part of the counting numbers. Only infinite sets can do this.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">=\u003c/span>Equal sets\u003c/h3>\n\u003cdiv class=\"def\">\u003ccode>A = B\u003c/code> when they have \u003cb>exactly the same elements\u003c/b>. Order and repeats do not matter.\u003c/div>\n\u003cul class=\"eg\">\u003cli>{1, 2, 3} = {3, 2, 1}\u003c/li>\u003cli>{a, a, b} = {a, b}\u003c/li>\u003cli>{x | x is a vowel} = {a, e, i, o, u}\u003c/li>\u003cli>{1, 2} ≠ {1, 2, 3}\u003c/li>\u003c/ul>\n\u003cp>A test you can use: A = B exactly when \u003ccode>A ⊆ B\u003c/code> and \u003ccode>B ⊆ A\u003c/code>.\u003c/p>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> {2, 3, 5, 7} = {prime numbers less than 10}. The same set often has a roster form and a rule form.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">~\u003c/span>Equivalent sets\u003c/h3>\n\u003cdiv class=\"def\">\u003ccode>A ~ B\u003c/code> when they have the \u003cb>same number of elements\u003c/b>, so \u003ccode>n(A) = n(B)\u003c/code>. The elements can be totally different.\u003c/div>\n\u003cul class=\"eg\">\u003cli>{a, b, c} ~ {1, 2, 3}\u003c/li>\u003cli>{Mon, Tue} ~ {red, blue}\u003c/li>\u003cli>{vowels} ~ {Mon, Tue, Wed, Thu, Fri}\u003c/li>\u003c/ul>\n\u003cp>You can check by pairing: match each element of A with one in B. If nothing is left over on either side, they are equivalent.\u003c/p>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> Equal sets are always equivalent, but equivalent sets are \u003ci>not\u003c/i> always equal. Same size, different members.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">∩ = ∅\u003c/span>Disjoint sets\u003c/h3>\n\u003cdiv class=\"def\">Two sets are disjoint when they have \u003cb>nothing in common\u003c/b>: \u003ccode>A ∩ B = ∅\u003c/code>.\u003c/div>\n\u003cul class=\"eg\">\u003cli>{even numbers} and {odd numbers}\u003c/li>\u003cli>{vowels} and {consonants}\u003c/li>\u003cli>{1, 2, 3} and {4, 5}\u003c/li>\u003c/ul>\n\u003cp>{1, 2, 3} and {3, 4} are \u003ci>not\u003c/i> disjoint, because both contain 3. One shared element is enough to break it.\u003c/p>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> If a set is split into disjoint pieces that cover all of it, the pieces are called a partition. A class split into sections is a partition of the students.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q5\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l6\" data-nav=\"Operations\">\u003ch2>Operations on sets\u003c/h2>\n\u003cp>Operations build new sets out of old ones. We will use the same sets throughout:\u003c/p>\n\u003cdiv class=\"def\">\u003ccode>U = {1, 2, 3, …, 10}\u003c/code>\u003cbr>\u003ccode>A = {1, 2, 3, 4, 5}\u003c/code>\u003cbr>\u003ccode>B = {4, 5, 6, 7}\u003c/code>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">∪\u003c/span>Union\u003c/h3>\n\u003cdiv class=\"def\">\u003cb>A ∪ B\u003c/b> is everything that is in A, or in B, or in both. Think “or”.\u003c/div>\n\u003cp>\u003cb>How to do it:\u003c/b> write all of A, then add the elements of B you have not written yet. Never write an element twice.\u003c/p>\n\u003cp>\u003ccode>A ∪ B = {1, 2, 3, 4, 5, 6, 7}\u003c/code>. The 4 and 5 appear once only.\u003c/p>\n\u003cul class=\"eg\">\u003cli>{a, b} ∪ {b, c} = {a, b, c}\u003c/li>\u003cli>A ∪ ∅ = A\u003c/li>\u003cli>A ∪ A = A\u003c/li>\u003cli>A ∪ B = B ∪ A\u003c/li>\u003c/ul>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> Merging two playlists without repeating a song is a union. The count rule is \u003ccode>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)\u003c/code>. Here: 5 + 4 − 2 = 7. You subtract the overlap because it was counted twice.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">∩\u003c/span>Intersection\u003c/h3>\n\u003cdiv class=\"def\">\u003cb>A ∩ B\u003c/b> is only what is in \u003cb>both\u003c/b> A and B. Think “and”.\u003c/div>\n\u003cp>\u003cb>How to do it:\u003c/b> go through A and keep each element that also appears in B.\u003c/p>\n\u003cp>\u003ccode>A ∩ B = {4, 5}\u003c/code>.\u003c/p>\n\u003cul class=\"eg\">\u003cli>{even numbers} ∩ {prime numbers} = {2}\u003c/li>\u003cli>{1, 2} ∩ {3, 4} = ∅, so they are disjoint\u003c/li>\u003cli>A ∩ U = A\u003c/li>\u003cli>A ∩ ∅ = ∅\u003c/li>\u003c/ul>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> Students who play chess \u003ci>and\u003c/i> basketball are the intersection of the chess club and the basketball team. The intersection is never larger than the smaller of the two sets.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">−\u003c/span>Difference\u003c/h3>\n\u003cdiv class=\"def\">\u003cb>A − B\u003c/b> is what is in A but \u003cb>not\u003c/b> in B. Also written A \\ B.\u003c/div>\n\u003cp>\u003cb>How to do it:\u003c/b> start with A, then throw away anything that also appears in B.\u003c/p>\n\u003cp>\u003ccode>A − B = {1, 2, 3}\u003c/code> but \u003ccode>B − A = {6, 7}\u003c/code>. Order matters here, unlike union and intersection.\u003c/p>\n\u003cul class=\"eg\">\u003cli>{1,2,3,4} − {2,4} = {1, 3}\u003c/li>\u003cli>A − A = ∅\u003c/li>\u003cli>A − ∅ = A\u003c/li>\u003cli>A − B = A ∩ B′\u003c/li>\u003c/ul>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> Subtracting a set that shares nothing with A changes nothing. {1, 2} − {9} is still {1, 2}.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">′\u003c/span>Complement\u003c/h3>\n\u003cdiv class=\"def\">\u003cb>A′\u003c/b> (also Aᶜ or Ā) is everything in \u003cb>U\u003c/b> that is not in A.\u003c/div>\n\u003cp>\u003cb>How to do it:\u003c/b> look at U, and keep what A does not have. \u003ccode>A′ = {6, 7, 8, 9, 10}\u003c/code> and \u003ccode>B′ = {1, 2, 3, 8, 9, 10}\u003c/code>.\u003c/p>\n\u003cul class=\"eg\">\u003cli>A ∪ A′ = U (together they cover everything)\u003c/li>\u003cli>A ∩ A′ = ∅ (nothing is in both)\u003c/li>\u003cli>(A′)′ = A\u003c/li>\u003cli>∅′ = U and U′ = ∅\u003c/li>\u003c/ul>\n\u003cp>De Morgan's laws connect complements to the other operations: \u003ccode>(A ∪ B)′ = A′ ∩ B′\u003c/code> and \u003ccode>(A ∩ B)′ = A′ ∪ B′\u003c/code>. Check the first: (A ∪ B)′ = {8, 9, 10}, and A′ ∩ B′ = {8, 9, 10}. ✓\u003c/p>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> This is just “not” from logic. The complement of “even” is “odd” when U is the integers, but it is something else if U is different.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">Δ\u003c/span>Symmetric difference\u003c/h3>\n\u003cdiv class=\"def\">\u003cb>A Δ B\u003c/b> is what is in A or B but \u003cb>not both\u003c/b>.\u003c/div>\n\u003cp>\u003cb>How to do it:\u003c/b> take the union, then remove the overlap. \u003ccode>A Δ B = {1, 2, 3, 6, 7}\u003c/code>.\u003c/p>\n\u003cp>It has two equal forms: \u003ccode>(A − B) ∪ (B − A)\u003c/code> and \u003ccode>(A ∪ B) − (A ∩ B)\u003c/code>. Check: {1,2,3} ∪ {6,7} gives the same answer.\u003c/p>\n\u003cul class=\"eg\">\u003cli>{1, 2} Δ {2, 3} = {1, 3}\u003c/li>\u003cli>A Δ A = ∅\u003c/li>\u003cli>A Δ ∅ = A\u003c/li>\u003c/ul>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> Programmers know this as XOR: true when exactly one of two things is true.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"topic\">\u003ch3>\u003cspan class=\"sy\">×\u003c/span>Cartesian product\u003c/h3>\n\u003cdiv class=\"def\">\u003cb>A × B\u003c/b> is the set of all \u003cb>ordered pairs\u003c/b> (a, b), with a from A and b from B.\u003c/div>\n\u003cp>Let \u003ccode>P = {1, 2}\u003c/code> and \u003ccode>Q = {x, y}\u003c/code>. Then \u003ccode>P × Q = {(1,x), (1,y), (2,x), (2,y)}\u003c/code>.\u003c/p>\n\u003cp>Order matters: (1, x) is not the same as (x, 1), so P × Q ≠ Q × P. The size is \u003ccode>n(P × Q) = n(P) · n(Q) = 2 · 2 = 4\u003c/code>.\u003c/p>\n\u003cdiv class=\"fun\">\u003cb>Fun fact:\u003c/b> Grid coordinates (x, y) are a Cartesian product. A menu with 3 mains and 4 drinks gives 3 × 4 = 12 possible meals.\u003c/div>\u003c/div>\n\n\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q6\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"sym\" class=\"recap\" data-nav=\"Symbols\">\u003ch2>Set symbols to memorize\u003c/h2>\n\u003cp>Every symbol you will meet in this part, grouped so they are easier to learn. Each one shows its name, how to say it out loud, and a tiny example. Use test mode to see the symbol alone and recall the meaning before you tap.\u003c/p>\n\u003cbutton class=\"tst\" type=\"button\">Test yourself: hide the meanings\u003c/button>\u003cp class=\"hint\">In test mode, tap a card to reveal its meaning.\u003c/p>\n\u003ch3>Basic notation\u003c/h3>\u003cdiv class=\"kws symgrid\">\u003cdiv class=\"kw\">\u003cb>{ }\u003c/b>\u003cspan>\u003cstrong>Set braces\u003c/strong>\u003cbr>Say: “the set containing …”\u003cbr>Ex: {1, 2, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>…\u003c/b>\u003cspan>\u003cstrong>Ellipsis\u003c/strong>\u003cbr>Say: “and so on”\u003cbr>Ex: {1, 2, 3, …}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>|  or  :\u003c/b>\u003cspan>\u003cstrong>Such that\u003c/strong>\u003cbr>Say: “such that”\u003cbr>Ex: {x | x &gt; 0}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>∅\u003c/b>\u003cspan>\u003cstrong>Empty set (also { })\u003c/strong>\u003cbr>Say: “the empty set”\u003cbr>Ex: {months with 40 days} = ∅\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>U\u003c/b>\u003cspan>\u003cstrong>Universal set\u003c/strong>\u003cbr>Say: “universal set”\u003cbr>Ex: U = {1, 2, …, 10}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>(a, b)\u003c/b>\u003cspan>\u003cstrong>Ordered pair\u003c/strong>\u003cbr>Say: “the pair a, b”\u003cbr>Ex: (1, x)\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Membership and size\u003c/h3>\u003cdiv class=\"kws symgrid\">\u003cdiv class=\"kw\">\u003cb>∈\u003c/b>\u003cspan>\u003cstrong>Is an element of\u003c/strong>\u003cbr>Say: “2 is an element of A”\u003cbr>Ex: 2 ∈ {1, 2, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>∉\u003c/b>\u003cspan>\u003cstrong>Is not an element of\u003c/strong>\u003cbr>Say: “5 is not an element of A”\u003cbr>Ex: 5 ∉ {1, 2, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>n(A)  |A|\u003c/b>\u003cspan>\u003cstrong>Cardinality: number of elements\u003c/strong>\u003cbr>Say: “n of A”\u003cbr>Ex: n({a, b, c}) = 3\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Comparing sets\u003c/h3>\u003cdiv class=\"kws symgrid\">\u003cdiv class=\"kw\">\u003cb>=\u003c/b>\u003cspan>\u003cstrong>Equal sets\u003c/strong>\u003cbr>Say: “A equals B”\u003cbr>Ex: {1, 2} = {2, 1}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>≠\u003c/b>\u003cspan>\u003cstrong>Not equal\u003c/strong>\u003cbr>Say: “A is not equal to B”\u003cbr>Ex: {1, 2} ≠ {1, 2, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>~\u003c/b>\u003cspan>\u003cstrong>Equivalent (same size)\u003c/strong>\u003cbr>Say: “A is equivalent to B”\u003cbr>Ex: {a, b} ~ {1, 2}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>⊆\u003c/b>\u003cspan>\u003cstrong>Subset (can be equal)\u003c/strong>\u003cbr>Say: “A is a subset of B”\u003cbr>Ex: {1, 2} ⊆ {1, 2, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>⊂\u003c/b>\u003cspan>\u003cstrong>Proper subset\u003c/strong>\u003cbr>Say: “A is a proper subset of B”\u003cbr>Ex: {1} ⊂ {1, 2}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>⊄\u003c/b>\u003cspan>\u003cstrong>Not a subset\u003c/strong>\u003cbr>Say: “A is not a subset of B”\u003cbr>Ex: {1, 5} ⊄ {1, 2, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>⊇\u003c/b>\u003cspan>\u003cstrong>Superset\u003c/strong>\u003cbr>Say: “A is a superset of B”\u003cbr>Ex: {1, 2, 3} ⊇ {1, 2}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>⊃\u003c/b>\u003cspan>\u003cstrong>Proper superset\u003c/strong>\u003cbr>Say: “A is a proper superset of B”\u003cbr>Ex: {1, 2, 3} ⊃ {1, 2}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>A ∩ B = ∅\u003c/b>\u003cspan>\u003cstrong>Disjoint sets\u003c/strong>\u003cbr>Say: “A and B are disjoint”\u003cbr>Ex: {1, 2} and {3, 4}\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Operations\u003c/h3>\u003cdiv class=\"kws symgrid\">\u003cdiv class=\"kw\">\u003cb>∪\u003c/b>\u003cspan>\u003cstrong>Union (OR)\u003c/strong>\u003cbr>Say: “A union B”\u003cbr>Ex: {1, 2} ∪ {2, 3} = {1, 2, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>∩\u003c/b>\u003cspan>\u003cstrong>Intersection (AND)\u003c/strong>\u003cbr>Say: “A intersect B”\u003cbr>Ex: {1, 2} ∩ {2, 3} = {2}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>−  or  \\\u003c/b>\u003cspan>\u003cstrong>Difference\u003c/strong>\u003cbr>Say: “A minus B”, “A without B”\u003cbr>Ex: {1, 2, 3} − {2} = {1, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>A′  Aᶜ  Ā\u003c/b>\u003cspan>\u003cstrong>Complement\u003c/strong>\u003cbr>Say: “A complement”, “not A”\u003cbr>Ex: U = {1, 2, 3}, A = {1}, A′ = {2, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Δ  or  ⊕\u003c/b>\u003cspan>\u003cstrong>Symmetric difference\u003c/strong>\u003cbr>Say: “A delta B”\u003cbr>Ex: {1, 2} Δ {2, 3} = {1, 3}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>×\u003c/b>\u003cspan>\u003cstrong>Cartesian product\u003c/strong>\u003cbr>Say: “A cross B”\u003cbr>Ex: {1, 2} × {x} = {(1, x), (2, x)}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>P(A)\u003c/b>\u003cspan>\u003cstrong>Power set (2ⁿ subsets)\u003c/strong>\u003cbr>Say: “the power set of A”\u003cbr>Ex: P({a, b}) = {∅, {a}, {b}, {a, b}}\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Number sets\u003c/h3>\u003cdiv class=\"kws symgrid\">\u003cdiv class=\"kw\">\u003cb>ℕ\u003c/b>\u003cspan>\u003cstrong>Natural (counting) numbers\u003c/strong>\u003cbr>Say: “N”\u003cbr>Ex: {1, 2, 3, …}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>W\u003c/b>\u003cspan>\u003cstrong>Whole numbers\u003c/strong>\u003cbr>Say: “W”\u003cbr>Ex: {0, 1, 2, 3, …}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>ℤ\u003c/b>\u003cspan>\u003cstrong>Integers\u003c/strong>\u003cbr>Say: “Z”\u003cbr>Ex: {…, −2, −1, 0, 1, 2, …}\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>ℚ\u003c/b>\u003cspan>\u003cstrong>Rational numbers (fractions)\u003c/strong>\u003cbr>Say: “Q”\u003cbr>Ex: 1/2, −3, 0.75\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>ℝ\u003c/b>\u003cspan>\u003cstrong>Real numbers\u003c/strong>\u003cbr>Say: “R”\u003cbr>Ex: every point on the number line\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>ℂ\u003c/b>\u003cspan>\u003cstrong>Complex numbers\u003c/strong>\u003cbr>Say: “C”\u003cbr>Ex: 3 + 2i\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Logic symbols you will also see\u003c/h3>\u003cdiv class=\"kws symgrid\">\u003cdiv class=\"kw\">\u003cb>∀\u003c/b>\u003cspan>\u003cstrong>For all\u003c/strong>\u003cbr>Say: “for all x”\u003cbr>Ex: ∀x ∈ ℕ, x &gt; 0\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>∃\u003c/b>\u003cspan>\u003cstrong>There exists\u003c/strong>\u003cbr>Say: “there exists an x”\u003cbr>Ex: ∃x ∈ A, x is even\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>∧\u003c/b>\u003cspan>\u003cstrong>And\u003c/strong>\u003cbr>Say: “p and q”\u003cbr>Ex: p ∧ q\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>∨\u003c/b>\u003cspan>\u003cstrong>Or\u003c/strong>\u003cbr>Say: “p or q”\u003cbr>Ex: p ∨ q\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>¬\u003c/b>\u003cspan>\u003cstrong>Not\u003c/strong>\u003cbr>Say: “not p”\u003cbr>Ex: ¬p\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>⇒\u003c/b>\u003cspan>\u003cstrong>Implies\u003c/strong>\u003cbr>Say: “p implies q”\u003cbr>Ex: p ⇒ q\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>⇔\u003c/b>\u003cspan>\u003cstrong>If and only if\u003c/strong>\u003cbr>Say: “p if and only if q”\u003cbr>Ex: A = B ⇔ A ⊆ B and B ⊆ A\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>∴\u003c/b>\u003cspan>\u003cstrong>Therefore\u003c/strong>\u003cbr>Say: “therefore”\u003cbr>Ex: ∴ x = 2\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>How to read statements out loud\u003c/h3>\u003cdiv class=\"wide\">\u003ctable style=\"min-width:0\">\u003ctr>\u003cth>Written\u003c/th>\u003cth>Say it like this\u003c/th>\u003c/tr>\u003ctr>\u003ctd>A ∪ B = {1, 2, 3}\u003c/td>\u003ctd>A union B equals the set 1, 2, 3.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 ∈ A ∩ B\u003c/td>\u003ctd>4 is an element of A intersect B.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B ⊆ A\u003c/td>\u003ctd>B is a subset of A.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>x ∉ A′\u003c/td>\u003ctd>x is not in the complement of A.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A = {x | x ∈ ℕ, x &lt; 4}\u003c/td>\u003ctd>A is the set of all x such that x is a natural number less than 4, so A = {1, 2, 3}.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)\u003c/td>\u003ctd>The size of A union B equals the size of A plus the size of B, minus the size of the intersection.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"fun\">\u003cb>Memory tricks:\u003c/b>\u003cbr>\n• ∪ looks like a \u003cb>U\u003c/b>: \u003cb>U\u003c/b>nion. ∩ is an \u003cb>A\u003c/b> without its bar: \u003cb>A\u003c/b>ND.\u003cbr>\n• ∈ looks like an \u003cb>E\u003c/b>: \u003cb>E\u003c/b>lement. ∉ is the same E crossed out.\u003cbr>\n• ⊂ points like \u003cb>&lt;\u003c/b> (smaller), ⊆ adds the bar like \u003cb>≤\u003c/b>. ⊃ and ⊇ match &gt; and ≥.\u003cbr>\n• ∅ is a zero with a slash: zero elements.\u003cbr>\n• ℕ = \u003cb>N\u003c/b>atural, ℤ = \u003cb>Z\u003c/b>ahlen (German for numbers), ℚ = \u003cb>Q\u003c/b>uotient (fractions), ℝ = \u003cb>R\u003c/b>eal.\u003cbr>\n• A′ takes “the rest” of U. Δ is a triangle: “different, not both”.\u003cbr>\n• ∀ is an upside-down \u003cb>A\u003c/b> (\u003cb>A\u003c/b>ll). ∃ is a backward \u003cb>E\u003c/b> (\u003cb>E\u003c/b>xists).\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"qsym\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"k1\" class=\"recap\" data-nav=\"Sets keywords\">\u003ch2>Part 1 keywords: Sets\u003c/h2>\n\u003cp>The whole of Part 1 on one page. Read it, then switch on test mode and see how many meanings you can say before you tap.\u003c/p>\n\u003ch3>Symbols\u003c/h3>\u003cdiv class=\"syms\">\u003cdiv class=\"sm\">\u003ci>∈\u003c/i>\u003cspan>is an element of\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>∉\u003c/i>\u003cspan>is not an element of\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>⊆\u003c/i>\u003cspan>subset (can be equal)\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>⊂\u003c/i>\u003cspan>proper subset\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>∅\u003c/i>\u003cspan>empty set\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>U\u003c/i>\u003cspan>universal set\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>∪\u003c/i>\u003cspan>union = OR\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>∩\u003c/i>\u003cspan>intersection = AND\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>A − B\u003c/i>\u003cspan>in A, not in B\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>A′\u003c/i>\u003cspan>complement of A\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>Δ\u003c/i>\u003cspan>in one, not both\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>×\u003c/i>\u003cspan>Cartesian product\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>n(A)\u003c/i>\u003cspan>size of A\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>P(A)\u003c/i>\u003cspan>power set\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Keywords\u003c/h3>\u003cbutton class=\"tst\" type=\"button\">Test yourself: hide the meanings\u003c/button>\u003cp class=\"hint\">In test mode, tap a card to reveal its meaning.\u003c/p>\u003cdiv class=\"kws\">\u003cdiv class=\"kw\">\u003cb>Set\u003c/b>\u003cspan>A collection of distinct objects. Order and repeats don't matter.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Well-defined\u003c/b>\u003cspan>You can always tell for sure whether something belongs.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Element\u003c/b>\u003cspan>One member of a set.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Roster form\u003c/b>\u003cspan>List them: {2, 4, 6, 8}.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Rule form\u003c/b>\u003cspan>Describe them: {x | x is even}. The bar means “such that”.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Empty set ∅\u003c/b>\u003cspan>No elements. {∅} and {0} are not empty.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Singleton\u003c/b>\u003cspan>Exactly one element. 5 is an element, {5} is a set.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Universal set U\u003c/b>\u003cspan>Everything in the problem. Complements need it.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Finite\u003c/b>\u003cspan>Counting ends. n(A) is a whole number.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Infinite\u003c/b>\u003cspan>Counting never ends. Use dots: {1, 2, 3, …}.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Equal sets\u003c/b>\u003cspan>Exactly the same elements.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Equivalent sets\u003c/b>\u003cspan>Same number of elements, different members allowed.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Disjoint\u003c/b>\u003cspan>Nothing in common: A ∩ B = ∅.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Subset ⊆\u003c/b>\u003cspan>Every element of A is in B.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Proper subset ⊂\u003c/b>\u003cspan>A ⊆ B and B has something extra.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Power set\u003c/b>\u003cspan>All subsets of A. There are 2ⁿ of them.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Union ∪\u003c/b>\u003cspan>Everything in A or B or both. No repeats.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Intersection ∩\u003c/b>\u003cspan>Only what is in both.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Difference A − B\u003c/b>\u003cspan>In A but not B. Order matters.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Complement A′\u003c/b>\u003cspan>In U but not in A.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Symmetric difference\u003c/b>\u003cspan>In A or B but not both: (A ∪ B) − (A ∩ B).\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Cartesian product\u003c/b>\u003cspan>All ordered pairs (a, b). Size n(A) · n(B).\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Formulas\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable style=\"min-width:0\">\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Formula\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Size of a union\u003c/td>\u003ctd>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Number of subsets\u003c/td>\u003ctd>2ⁿ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Complement laws\u003c/td>\u003ctd>A ∪ A′ = U and A ∩ A′ = ∅\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>De Morgan\u003c/td>\u003ctd>(A ∪ B)′ = A′ ∩ B′ and (A ∩ B)′ = A′ ∪ B′\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Difference\u003c/td>\u003ctd>A − B = A ∩ B′\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"fun\">\u003cb>Memory tricks:\u003c/b> ∪ looks like a \u003cb>U\u003c/b>, so it means Union. ∩ looks like an \u003cb>A\u003c/b> without its bar, so it means \u003cb>A\u003c/b>ND. ∈ is for a single element, ⊆ is for a whole set inside another.\u003c/div>\n\u003ch3>Mix-ups to avoid\u003c/h3>\u003cdiv class=\"wide\">\u003ctable style=\"min-width:0\">\u003ctr>\u003cth>Mix-up\u003c/th>\u003cth>Remember\u003c/th>\u003c/tr>\u003ctr>\u003ctd>∈ vs ⊆\u003c/td>\u003ctd>∈ links an element to a set. ⊆ links a set to a set.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5 vs {5}\u003c/td>\u003ctd>5 is an element. {5} is a set.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Equal vs equivalent\u003c/td>\u003ctd>Equal means same members. Equivalent means same size.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>∅ vs {∅}\u003c/td>\u003ctd>∅ has 0 elements. {∅} has 1.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A − B vs B − A\u003c/td>\u003ctd>Different answers. Order matters.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Subset vs proper subset\u003c/td>\u003ctd>A set is a subset of itself but never a proper subset of itself.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003c/section>\n\u003cdiv class=\"part\">\u003ch1>Part 2: Relations and functions\u003c/h1>\n\u003cp class=\"lead\">Based on your professor's lecture notes. By the end you should be able to explain a relation and a function, identify inputs and outputs, decide whether a relation is a function, and calculate an output using a simple rule. Tap “Show answer” whenever you see a pause question.\u003c/p>\u003c/div>\n\n\u003csection id=\"l7\" data-nav=\"Relations\">\u003ch2>What is a relation?\u003c/h2>\n\u003cdiv class=\"def\">A \u003cb>relation\u003c/b> is a collection of pairs that shows a connection between inputs and outputs. Each connection is an \u003cb>ordered pair\u003c/b>: \u003ccode>(input, output)\u003c/code>. The first entry is the input and the second is the output.\u003c/div>\n\u003cp>\u003cb>Example:\u003c/b> \u003ccode>(Ana, Laptop)\u003c/code> means Ana uses a laptop. If Ana also uses a phone and Ben uses a laptop, the relation “uses” contains these pairs:\u003c/p>\n\u003cp>\u003ccode>(Ana, Laptop), (Ana, Phone), (Ben, Laptop)\u003c/code>\u003c/p>\n\u003cp>A relation can connect one input to more than one output. Ana is linked to two devices, and that is fine for a relation. Inputs and outputs can be names or objects, not only numbers.\u003c/p>\n\u003cdetails>\u003csummary>Pause and answer: in (ID101, Ana), which is the input and which is the output?\u003c/summary>\u003cp>ID101 is the input and Ana is the output.\u003c/p>\u003c/details>\n\u003cdiv class=\"fun\">\u003cb>Link to Part 1:\u003c/b> a relation from A to B is just a subset of the Cartesian product A × B, a set of ordered pairs.\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"fq1\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l8\" data-nav=\"Functions\">\u003ch2>When is a relation a function?\u003c/h2>\n\u003cdiv class=\"def\">A \u003cb>function\u003c/b> is a relation in which \u003cb>every allowed input has exactly one output\u003c/b>. To decide, focus on the inputs.\u003cbr>\u003cbr>\u003cb>Main rule:\u003c/b> each input must have one output only. Different inputs may share the same output. Every function is a relation, but not every relation is a function.\u003c/div>\n\u003ch3>Example A: student IDs and names\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable style=\"min-width:0\">\u003ctr>\u003cth>Input (Student ID)\u003c/th>\u003cth>Output (Registered name)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>ID101\u003c/td>\u003ctd>Ana\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ID102\u003c/td>\u003ctd>Ben\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ID103\u003c/td>\u003ctd>Ana\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>This is a function. Each ID has one recorded name. IDs 101 and 103 belong to different students who share the name Ana, and repeating an output is allowed.\u003c/p>\n\u003ch3>Example B: students and devices\u003c/h3>\n\u003cp>\u003ccode>(Ana, Laptop), (Ana, Phone), (Ben, Laptop)\u003c/code> is a relation, but \u003cb>not\u003c/b> a function from student to device. The same input, Ana, has two different outputs: Laptop and Phone.\u003c/p>\n\u003ch3>Seeing the difference with arrows\u003c/h3>\n\u003cdiv class=\"fig\" id=\"fig1\">\u003c/div>\n\u003cp class=\"cap\">The first two diagrams are functions. The third is not: input 1 points to both 2 and 4.\u003c/p>\n\u003cp>In the middle diagram, inputs 1 and 2 both point to 2. This is allowed. The unused target 6 is not a problem. In the third diagram, one input points to two different values, which breaks the function rule.\u003c/p>\n\u003ch3>How to check a table or list of pairs\u003c/h3>\n\u003cp>Read the inputs one at a time. If an input appears again, compare its outputs. Two different outputs for the same input mean it is not a function. Repeating the same pair does not add a different output. If a domain is specified, every input in that domain must have an output.\u003c/p>\n\u003cdetails>\u003csummary>Try together: is (1, 5), (2, 5), (3, 5) a function? What about (1, 5), (1, 7), (2, 8)?\u003c/summary>\u003cp>(1,5),(2,5),(3,5) is a function: each input has exactly one output, and sharing output 5 is allowed. (1,5),(1,7),(2,8) is not: input 1 has two different outputs.\u003c/p>\u003c/details>\n\u003cdiv class=\"slide tool\">\u003cdiv class=\"k\">Try your own pairs\u003c/div>\n\u003clabel for=\"rp\">Pairs, like (1,a),(2,b),(3,a)\u003c/label>\u003cinput id=\"rp\" value=\"(1,5),(2,5),(3,5)\" autocomplete=\"off\">\n\u003clabel for=\"rd\">Domain (optional, comma separated)\u003c/label>\u003cinput id=\"rd\" placeholder=\"1,2,3\" autocomplete=\"off\">\n\u003cdiv class=\"res\" id=\"rres\" aria-live=\"polite\">\u003c/div>\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"fq2\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l9\" data-nav=\"Rules &amp; notation\">\u003ch2>Inputs, outputs, and simple function rules\u003c/h2>\n\u003ch3>Domain and range\u003c/h3>\n\u003cp>The \u003cb>domain\u003c/b> is the collection of allowed inputs. The \u003cb>range\u003c/b> is the collection of outputs actually produced. For a list of pairs, read the first entries for the domain and the second entries for the range.\u003c/p>\n\u003cp>\u003cb>Example:\u003c/b> (1, 5), (2, 5), (3, 7). Domain: 1, 2, 3. Range: 5, 7. List the repeated output 5 only once. It is a function because each input has one output.\u003c/p>\n\u003ch3>What does function notation mean?\u003c/h3>\n\u003cp>We often name a function f. \u003ccode>f(x)\u003c/code>, read “f of x”, means the \u003cb>output for input x\u003c/b>. It does not mean f multiplied by x. For \u003ccode>f(x) = 2x + 1\u003c/code> the rule is: multiply the input by 2, then add 1.\u003c/p>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Worked example: find the output for input 3\u003c/div>\n\u003col class=\"steps\">\u003cli>Write the rule: f(x) = 2x + 1\u003c/li>\u003cli>Replace x with 3: f(3) = 2(3) + 1\u003c/li>\u003cli>Multiply first: f(3) = 6 + 1\u003c/li>\u003cli>Add: f(3) = 7\u003c/li>\u003c/ol>\n\u003cp>Input 3 produces output 7, so the pair is (3, 7).\u003c/p>\u003c/div>\n\u003cdiv class=\"wide\">\u003ctable style=\"min-width:0\">\u003ctr>\u003cth>Input x\u003c/th>\u003cth>Calculation\u003c/th>\u003cth>Output f(x)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>2(0) + 1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>2(1) + 1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>2(2) + 1\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>2(3) + 1\u003c/td>\u003ctd>7\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Worked example: printing a document\u003c/div>\n\u003cp>Printing costs ₱3 per page with no additional fee. Let \u003ccode>C(n) = 3n\u003c/code>, where n is the number of pages and C(n) is the cost in pesos. For 5 pages: C(5) = 3(5) = ₱15. Each page count gives one total cost, so this is a function.\u003c/p>\n\u003cp>The allowed inputs are whole page counts: 0, 1, 2, 3, and so on. Negative page counts make no sense. The outputs are ₱0, ₱3, ₱6, ₱9, and so on. Always consider what the input represents.\u003c/p>\u003c/div>\n\u003cdetails>\u003csummary>Try together: find f(4) for f(x) = 2x + 1, and the cost of 8 printed pages.\u003c/summary>\u003cp>f(4) = 2(4) + 1 = 8 + 1 = 9. C(8) = 3(8) = ₱24, so printing 8 pages costs ₱24.\u003c/p>\u003c/details>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"fq3\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l10\" data-nav=\"Graphs\">\u003ch2>Recognizing functions in graphs\u003c/h2>\n\u003cp>A graph is another way to show input and output pairs. The horizontal axis shows the input x and the vertical axis shows the output y. Each point is one ordered pair.\u003c/p>\n\u003cp>\u003cb>How to plot a point:\u003c/b> to plot (2, 4), start at (0, 0), move 2 units right, then 4 units up, and mark a point. Its input is 2 and its output is 4.\u003c/p>\n\u003cdiv class=\"fig\" id=\"fig2\">\u003c/div>\n\u003cp class=\"cap\">The dashed line fixes the input at x = 2. Graph A has one point at that input; Graph B has two.\u003c/p>\n\u003ch3>The vertical line test\u003c/h3>\n\u003cp>Imagine moving a vertical line from left to right across a graph. If it touches the graph more than once at any position, the graph is \u003cb>not\u003c/b> a function of x. Two points above the same input mean that input has two different outputs.\u003c/p>\n\u003cp>\u003cb>Graph A\u003c/b> is a function. Its pairs are (1, 3), (2, 4), (3, 5), and at x = 2 the only output is 4. \u003cb>Graph B\u003c/b> is not a function. It includes both (2, 4) and (2, 6), so input 2 has two outputs, 4 and 6, and the dashed line passes through both points.\u003c/p>\n\u003cp>A vertical line through a value outside the domain may touch no point. That is acceptable. The rule only forbids more than one output for an input.\u003c/p>\n\u003cdiv class=\"def\">\u003cb>Connecting the ideas:\u003c/b> a table, an arrow diagram, and a graph can all describe the same relationship. In a table, inspect repeated inputs. In an arrow diagram, count the arrows leaving each input. In a graph, use the vertical line test. All three check the same rule: \u003cb>one output for each allowed input\u003c/b>.\u003c/div>\n\u003cdetails>\u003csummary>Pause and answer: Graph A's domain and range? Which input makes Graph B fail?\u003c/summary>\u003cp>Graph A: domain 1, 2, 3 and range 3, 4, 5. In Graph B, input 2 has two outputs (4 and 6), so it fails the function rule.\u003c/p>\u003c/details>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"fq4\">\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection id=\"l11\" data-nav=\"Practice\">\u003ch2>Short practice and summary\u003c/h2>\n\u003cp>Try each question on paper first, give a short reason for each function decision, then open the answer.\u003c/p>\n\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check your understanding\u003c/div>\n\u003cp>\u003cb>1.\u003c/b> Decide whether each relation is a function: (a) (1,4), (2,4), (3,6) &nbsp; (b) (1,4), (1,6), (2,8)\u003c/p>\n\u003cdetails>\u003csummary>Show answer\u003c/summary>\u003cp>(a) Function: each input has one output, and inputs 1 and 2 share output 4, which is allowed. (b) Not a function: input 1 is paired with both 4 and 6.\u003c/p>\u003c/details>\n\u003cp>\u003cb>2.\u003c/b> For the relation in 1a, identify the domain and range.\u003c/p>\n\u003cdetails>\u003csummary>Show answer\u003c/summary>\u003cp>Domain: 1, 2, 3. Range: 4, 6. Write the repeated output 4 only once.\u003c/p>\u003c/details>\n\u003cp>\u003cb>3.\u003c/b> If f(x) = 2x + 1, find f(5). Show the substitution.\u003c/p>\n\u003cdetails>\u003csummary>Show answer\u003c/summary>\u003cp>f(5) = 2(5) + 1 = 10 + 1 = 11.\u003c/p>\u003c/details>\n\u003cp>\u003cb>4.\u003c/b> An internet cafe charges ₱20 per hour, with no extra fee: C(h) = 20h. Find C(3) and explain what it means.\u003c/p>\n\u003cdetails>\u003csummary>Show answer\u003c/summary>\u003cp>C(3) = 20(3) = ₱60. Three hours of use cost ₱60 under this pricing rule.\u003c/p>\u003c/details>\n\u003cp>\u003cb>5.\u003c/b> A graph includes (2, 3) and (2, 7). Can it represent y as a function of x?\u003c/p>\n\u003cdetails>\u003csummary>Show answer\u003c/summary>\u003cp>No. A vertical line at x = 2 meets both points, so the same input 2 would have outputs 3 and 7.\u003c/p>\u003c/details>\u003c/div>\n\u003ch3>Remember these five ideas\u003c/h3>\n\u003cul class=\"eg\">\u003cli>A relation connects inputs and outputs.\u003c/li>\u003cli>A function gives exactly one output to each allowed input.\u003c/li>\u003cli>Different inputs may share an output; one input cannot have two different outputs.\u003c/li>\u003cli>Domain means allowed inputs. Range means outputs actually produced.\u003c/li>\u003cli>To evaluate a function, substitute the input into the rule and calculate.\u003c/li>\u003c/ul>\n\u003cdiv class=\"fun\">\u003cb>Why this matters in IT:\u003c/b> a lookup using a unique student ID should return one student record. A cost calculator should return one total for a given page count and fixed price. Functions describe these predictable input-output relationships.\u003c/div>\u003c/section>\n\n\u003csection id=\"l12\" data-nav=\"Common errors\">\u003ch2>Common errors and further reading\u003c/h2>\n\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Common error\u003c/th>\u003cth>Correction\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Two inputs share an output, so it is not a function.\u003c/td>\u003ctd>Sharing an output is allowed. Check whether one input has different outputs.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>f(5) means f multiplied by 5.\u003c/td>\u003ctd>f(5) means the output of function f when the input is 5.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Domain means the answers.\u003c/td>\u003ctd>Domain means inputs. Range means outputs.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>A function must have a formula.\u003c/td>\u003ctd>A table or an arrow diagram can define a function too.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cb>Optional reading:\u003c/b> OpenStax, \u003ci>College Algebra\u003c/i>, Section 3.1 Functions and Function Notation. Read the introductory examples for extra practice: \u003ca href=\"https://openstax.org/books/college-algebra/pages/3-1-functions-and-function-notation\">openstax.org\u003c/a>.\u003c/p>\u003c/section>\n\u003csection id=\"k2\" class=\"recap\" data-nav=\"Functions keywords\">\u003ch2>Part 2 keywords: Relations and functions\u003c/h2>\n\u003cp>Everything from Part 2 in one place. Same idea: read, then test yourself.\u003c/p>\n\u003ch3>The one rule\u003c/h3>\n\u003cdiv class=\"def\">\u003cb>Function = every input has exactly ONE output.\u003c/b>\u003cbr>Outputs may be shared. An input may never split into two outputs.\u003c/div>\n\u003ch3>Symbols and notation\u003c/h3>\u003cdiv class=\"syms\">\u003cdiv class=\"sm\">\u003ci>(a, b)\u003c/i>\u003cspan>ordered pair (input, output)\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>f(x)\u003c/i>\u003cspan>output for input x\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>f(3) = 7\u003c/i>\u003cspan>input 3 gives output 7\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>C(n)\u003c/i>\u003cspan>cost for n items\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>→\u003c/i>\u003cspan>maps to / arrow\u003c/span>\u003c/div>\u003cdiv class=\"sm\">\u003ci>x, y\u003c/i>\u003cspan>input, output on a graph\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Keywords\u003c/h3>\u003cbutton class=\"tst\" type=\"button\">Test yourself: hide the meanings\u003c/button>\u003cp class=\"hint\">In test mode, tap a card to reveal its meaning.\u003c/p>\u003cdiv class=\"kws\">\u003cdiv class=\"kw\">\u003cb>Relation\u003c/b>\u003cspan>A collection of ordered pairs connecting inputs to outputs.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Ordered pair\u003c/b>\u003cspan>(input, output). The first entry is the input.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Input\u003c/b>\u003cspan>The first entry. What goes in.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Output\u003c/b>\u003cspan>The second entry. What comes out.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Function\u003c/b>\u003cspan>A relation where each allowed input has exactly one output.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Domain\u003c/b>\u003cspan>The allowed inputs. Read the first entries.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Range\u003c/b>\u003cspan>The outputs actually produced. Write repeats once.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Function notation\u003c/b>\u003cspan>f(x) is “f of x”: the output for input x. It is not f times x.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Evaluate\u003c/b>\u003cspan>Substitute the input into the rule, then calculate.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Table test\u003c/b>\u003cspan>If an input repeats, compare its outputs. Two different = not a function.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Arrow test\u003c/b>\u003cspan>Count the arrows leaving each input. More than one = not a function.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Vertical line test\u003c/b>\u003cspan>If a vertical line touches the graph twice anywhere, it is not a function.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Many-to-one\u003c/b>\u003cspan>Allowed. Two inputs can share one output.\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>One-to-many\u003c/b>\u003cspan>Not a function. One input has two outputs.\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Worked examples to remember\u003c/h3>\n\u003cdiv class=\"wide\">\u003ctable style=\"min-width:0\">\u003ctr>\u003cth>Example\u003c/th>\u003cth>Answer\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>(1,5), (2,5), (3,5)\u003c/td>\u003ctd>Function. Sharing 5 is fine.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>(1,5), (1,7), (2,8)\u003c/td>\u003ctd>Not a function. Input 1 has outputs 5 and 7.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>(1,5), (2,5), (3,7)\u003c/td>\u003ctd>Domain 1, 2, 3. Range 5, 7.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>f(x) = 2x + 1, f(3)\u003c/td>\u003ctd>2(3) + 1 = 7\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C(n) = 3n, C(8)\u003c/td>\u003ctd>3(8) = ₱24\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Graph with (2, 3) and (2, 7)\u003c/td>\u003ctd>Not a function. Vertical line at x = 2 hits both.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"fun\">\u003cb>Memory tricks:\u003c/b> \u003cb>D\u003c/b>omain is the \u003cb>D\u003c/b>oor in (inputs). Range is what comes out. Function = a vending machine: one button, one snack, though two buttons can give the same snack.\u003c/div>\n\u003ch3>Mix-ups to avoid\u003c/h3>\u003cdiv class=\"wide\">\u003ctable style=\"min-width:0\">\u003ctr>\u003cth>Mix-up\u003c/th>\u003cth>Remember\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Shared output\u003c/td>\u003ctd>Allowed. Only a split input breaks the rule.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>f(5)\u003c/td>\u003ctd>The output when the input is 5. Not f times 5.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Domain\u003c/td>\u003ctd>Inputs, not the answers.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Needs a formula?\u003c/td>\u003ctd>No. A table or an arrow diagram can define a function.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Function vs relation\u003c/td>\u003ctd>Every function is a relation. Not every relation is a function.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003c/main>\n\n\u003cscript>\n(function(){\n\nconst LESSONS=[\"What is a set?\",\"Naming sets\",\"∈ and ∉\",\"Subsets\",\"Special sets\",\"Operations\"];\n\nconst QS={\nqsym:[[\"Which symbol means “is an element of”?\",[\"∈\",\"⊆\",\"∪\"],0,\"∈ links an element to a set. Think E for Element.\"],\n[\"Which symbol means union?\",[\"∩\",\"∪\",\"⊂\"],1,\"∪ looks like a U: Union (A or B).\"],\n[\"What does ⊂ mean in {1} ⊂ {1, 2}?\",[\"Element of\",\"Union\",\"Proper subset\"],2,\"⊂ is a proper subset: contained, and B has something extra.\"],\n[\"Which symbol means “not a subset of”?\",[\"∉\",\"⊄\",\"⊂\"],1,\"⊄ is ⊂ with a slash. ∉ is for elements.\"],\n[\"ℤ stands for…\",[\"Real numbers\",\"Integers\",\"Rational numbers\"],1,\"ℤ is integers, from German Zahlen.\"],\n[\"∃ is read…\",[\"For all\",\"Therefore\",\"There exists\"],2,\"∃ is a backward E: Exists.\"],\n[\"A Δ B means…\",[\"In both A and B\",\"In A or B but not both\",\"In A but not B\"],1,\"Symmetric difference: one or the other, not both.\"]],\nq1:[[\"Is “the best singers in the world” a well-defined set?\",[\"Yes\",\"No\"],1,\"Opinions differ, so you can't say for sure who belongs.\"],\n[\"Is “the months of the year” a well-defined set?\",[\"Yes\",\"No\"],0,\"There are exactly 12 months, and it's clear what belongs.\"],\n[\"Is {5, 6, 7} the same set as {7, 5, 6, 6}?\",[\"Yes\",\"No\"],0,\"Order and repeats don't matter.\"]],\nq2:[[\"Which is the roster form of “even numbers less than 10, greater than 0”?\",[\"{2,4,6,8}\",\"{0,2,4,6,8,10}\",\"{1,3,5,7,9}\"],0,\"Greater than 0 and less than 10 rules out 0 and 10.\"],\n[\"Read aloud: {x | x is a vowel}\",[\"x such that x is a vowel\",\"x or x is a vowel\",\"x divided by a vowel\"],0,\"The bar | means “such that”.\"],\n[\"Which set is infinite?\",[\"{vowels}\",\"{days of the week}\",\"{whole numbers}\"],2,\"Whole numbers go on forever.\"]],\nq4:[[\"Is {2, 4} ⊆ {1, 2, 3, 4}?\",[\"Yes\",\"No\"],0,\"Both 2 and 4 are in the bigger set.\"],\n[\"How many subsets does {a, b, c} have?\",[\"3\",\"6\",\"8\"],2,\"2³ = 8, counting ∅ and the set itself.\"],\n[\"Is ∅ a subset of {1, 2}?\",[\"Yes\",\"No\"],0,\"∅ is a subset of every set.\"],\n[\"Is {1, 2} ⊂ {1, 2}?\",[\"Yes\",\"No\"],1,\"Proper subset needs an extra element in the bigger set. Use ⊆ here.\"]],\nq5:[[\"{x | x is an even prime number} is a…\",[\"Singleton\",\"Empty set\",\"Infinite set\"],0,\"Only 2 qualifies, so it is {2}.\"],\n[\"How many elements does {∅} have?\",[\"0\",\"1\",\"2\"],1,\"It holds one element: the empty set.\"],\n[\"Are {1, 3, 5} and {a, b, c} equal, equivalent, or both?\",[\"Equal\",\"Equivalent\",\"Both\"],1,\"Same size (3) but different elements, so equivalent only.\"],\n[\"Which pair is equivalent but not equal?\",[\"{1,2} and {2,1}\",\"{a,b} and {x,y}\",\"{1,2} and {1,2,3}\"],1,\"Same size, different members.\"],\n[\"Are {even numbers} and {odd numbers} disjoint?\",[\"Yes\",\"No\"],0,\"No integer is both even and odd.\"]],\nq6:[[\"U = {1,…,6}, A = {1,2,3}. What is A′?\",[\"{4,5,6}\",\"{1,2,3}\",\"{1,…,6}\"],0,\"The complement is everything in U not in A.\"],\n[\"{1,2,3} ∩ {3,4,5} = ?\",[\"{3}\",\"{1,2,3,4,5}\",\"∅\"],0,\"Only 3 is in both.\"],\n[\"{1,2,3} − {3,4,5} = ?\",[\"{1,2}\",\"{4,5}\",\"{1,2,4,5}\"],0,\"Remove from the first set whatever is in the second.\"],\n[\"A = {1,2,3}, B = {3,4}. What is A Δ B?\",[\"{1,2,4}\",\"{3}\",\"{1,2,3,4}\"],0,\"Remove the shared 3 from the union.\"],\n[\"If n(A)=6, n(B)=5, n(A ∩ B)=2, what is n(A ∪ B)?\",[\"9\",\"11\",\"13\"],0,\"6 + 5 − 2 = 9.\"]]\n};\nObject.keys(QS).forEach(id=>{\n const box=document.getElementById(id);\n QS[id].forEach(([q,opts,ans,why])=>{\n  const d=document.createElement(\"div\");d.className=\"q\";\n  d.innerHTML=`\u003cdiv>${q}\u003c/div>\u003cdiv class=\"o\">\u003c/div>\u003cdiv class=\"why\" aria-live=\"polite\">\u003c/div>`;\n  const o=d.querySelector(\".o\"),w=d.querySelector(\".why\");\n  opts.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;\n   b.onclick=()=>{[...o.children].forEach(x=>x.className=\"\");b.className=i===ans?\"good\":\"bad\";w.textContent=(i===ans?\"Correct. \":\"Not quite. \")+why};o.appendChild(b)});\n  box.appendChild(d);\n });\n});\n\nconst SETS=[\n[\"even numbers\",n=>n%2===0],[\"odd numbers\",n=>n%2!==0],[\"counting numbers\",n=>n>=1],\n[\"whole numbers\",n=>n>=0],[\"prime numbers\",n=>n>1&&[...Array(n).keys()].slice(2).every(k=>n%k)],\n[\"multiples of 5\",n=>n%5===0]];\nlet cur=[],ans=[],pick=[];\nconst rnd=n=>Math.floor(Math.random()*n);\nfunction newDrill(){\n cur=[...SETS].sort(()=>Math.random()-.5).slice(0,3);\n const L=[\"A\",\"B\",\"C\"];\n document.getElementById(\"defs\").innerHTML=cur.map((s,i)=>`${L[i]} = {${s[0]}}`).join(\"&nbsp;&nbsp; \");\n ans=[];pick=[];\n const box=document.getElementById(\"items\");box.innerHTML=\"\";\n for(let i=0;i\u003c6;i++){\n  const n=rnd(17)-3,si=rnd(3),ok=cur[si][1](n);ans.push(ok);pick.push(null);\n  const d=document.createElement(\"div\");d.className=\"it\";\n  d.innerHTML=`\u003cspan>${i+1}) ${n}\u003c/span>\u003cbutton data-v=\"1\" aria-label=\"element of\">∈\u003c/button>\u003cbutton data-v=\"0\" aria-label=\"not element of\">∉\u003c/button>\u003cspan>${L[si]}\u003c/span>\u003cspan class=\"mark\">\u003c/span>`;\n  d.querySelectorAll(\"but
