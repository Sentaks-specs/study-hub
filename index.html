x 4px 3px 0}\nbutton:focus-visible{outline:3px solid var(--a);outline-offset:1px}\nbutton.good{border-color:var(--ok);background:var(--ok);color:#fff}\nbutton.bad{border-color:var(--no);background:var(--no);color:#fff}\n.q{padding:12px 0;border-top:1px solid var(--line)}\n.why{font-size:15px;color:var(--mute);margin-top:4px}\n.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}\n.swot div{border:2px solid var(--line);border-radius:12px;padding:12px 14px}\n.swot .h{border-color:var(--ok)}.swot .x{border-color:var(--no)}\n.swot b{font-family:\"Space Grotesk\",sans-serif;font-size:18px;display:block}\n.swot small{display:block;color:var(--mute);font-family:\"Space Grotesk\",sans-serif;font-size:13px}\n.swot p{margin:6px 0 0;font-size:16px}\n@media(max-width:480px){.swot{grid-template-columns:1fr}}\n#mx input{width:64px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px \"Space Grotesk\",sans-serif}\n#mx input:focus-visible{outline:3px solid var(--a)}\n#mxmsg{font-family:\"Space Grotesk\",sans-serif;font-weight:700}\n\n.wk{font:700 13px \"Space Grotesk\",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin:-14px 0 14px}\npre{background:#14213d;color:#e8eefc;border-radius:10px;padding:12px 14px;overflow-x:auto;font:14.5px/1.5 ui-monospace,Menlo,Consolas,monospace}\npre code{background:none;padding:0;color:inherit;font:inherit}\n.tool input{width:84px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px \"Space Grotesk\",sans-serif}\n.gantt{display:flex;margin:14px 0 6px;border-radius:10px;overflow:hidden;border:1.5px solid var(--ink)}\n.gantt div{background:var(--a);color:var(--card);text-align:center;padding:8px 2px;font:700 14px \"Space Grotesk\",sans-serif;border-right:1.5px solid var(--card);min-width:34px}\n.gantt div.idle{background:var(--line);color:var(--mute)}\n.gantt small{display:block;font-weight:500;font-size:12px}\n.res{font:700 16px/1.7 \"Space Grotesk\",sans-serif}\n\u003c/style>\n\u003cstyle>\n/* readability redesign */\nbody{font-size:var(--fs,19px);line-height:1.85;-webkit-text-size-adjust:100%}\nmain{max-width:740px;padding:26px 16px 90px}\nhtml{scroll-padding-top:84px}\n.eyebrow{font:700 13px \"Space Grotesk\",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--a);margin-top:14px}\nmain>h1{font-size:clamp(36px,9vw,58px);margin:8px 0 14px}\n.lead{font-size:1.04em;line-height:1.8}\n.sizer{display:flex;align-items:center;gap:8px;margin:18px 0 6px;font:600 14px \"Space Grotesk\",sans-serif;color:var(--mute)}\n.sizer button{padding:5px 12px;margin:0;min-width:44px}\n.how{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}\n.how span{font:600 14px \"Space Grotesk\",sans-serif;padding:7px 14px;border-radius:20px;background:var(--tint);color:var(--ink)}\n.part{border:none;padding:30px 26px;border-radius:22px;margin:54px 0 10px;color:#fff;background:linear-gradient(135deg,#1b2a52,#2f5dff)}\n.part.p2{background:linear-gradient(135deg,#0b4a52,#12805c)}\n.part h1{color:#fff;margin:0 0 6px;font-size:clamp(28px,7vw,40px)}\n.part p{color:rgba(255,255,255,.88);margin:6px 0 0}\nsection{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px 26px;margin-top:34px;box-shadow:0 2px 0 var(--line),0 14px 30px -22px rgba(20,33,61,.5)}\nsection.p2{--a:#0f8f7a;--tint:#e0f4ef}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) section.p2{--a:#4fd1a1;--tint:#17342f}}\n:root[data-theme=\"dark\"] section.p2{--a:#4fd1a1;--tint:#17342f}\nsection h2{display:flex;align-items:center;gap:14px;font-size:clamp(24px,5.4vw,31px);line-height:1.2;margin:0 0 26px}\n.num{flex:none;display:inline-grid;place-items:center;min-width:46px;height:46px;border-radius:13px;background:var(--a);color:var(--card);font-size:21px}\nsection p{margin:0 0 20px}\nsection h3{font-size:22px;margin:40px 0 12px}\nsection ul,section ol{margin:0 0 20px}\nsection li{margin:8px 0}\n.def{background:var(--tint);border-left:6px solid var(--a);border-radius:0 16px 16px 0;padding:18px 22px;margin:26px 0}\n.fun{background:transparent;border:1.5px dashed var(--a);border-radius:16px;padding:16px 20px;margin:28px 0;font-size:.95em;line-height:1.75}\n.slide{background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px;margin:28px 0}\n.slide .k{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}\n.topic{border:1.5px solid var(--line);border-radius:20px;padding:10px 22px 18px;margin-top:30px;background:var(--bg)}\n.topic h3{display:flex;align-items:center;gap:14px;font-size:24px;margin:12px 0 16px}\n.topic .sy{display:inline-grid;place-items:center;min-width:50px;height:50px;padding:0 10px;border-radius:14px;background:var(--a);color:var(--card);font-size:22px;margin:0;flex:none}\n.topic .def,.topic .fun{background-clip:padding-box}\n.wide{border:1.5px solid var(--line);border-radius:14px;margin:22px 0}\n.wide table{margin:0;border-collapse:collapse}\nth{padding:12px 14px;background:var(--tint);color:var(--ink);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}\ntd{padding:13px 14px;font-size:16.5px;line-height:1.6}\ntr:nth-child(even) td{background:rgba(127,147,190,.07)}\ntr:last-child td{border-bottom:none}\ncode,.m{padding:3px 9px;font-size:.88em}\n.ex{display:block;margin-top:6px;padding:10px 14px;border-radius:10px;font-size:15.5px}\n.q{padding:18px 0}\nbutton{padding:10px 17px;margin:6px 8px 6px 0;border-radius:10px}\n.why{font-size:16px;margin-top:8px;line-height:1.6}\ndetails{padding:12px 18px;border-radius:14px;margin:20px 0}\ndetails p{margin:10px 0 4px}\n.drill .it{padding:12px 0}\n.fig{margin:26px 0 10px}\n.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:38px;padding-top:20px;border-top:1.5px solid var(--line)}\n.pager a{font:700 15px \"Space Grotesk\",sans-serif;color:var(--a);text-decoration:none;padding:10px 16px;border:1.5px solid var(--a);border-radius:12px}\n.chip.on{background:var(--ink);color:var(--bg)}\n#bar{position:fixed;left:0;top:0;height:4px;width:0;background:linear-gradient(90deg,#2f5dff,#12a37f);z-index:20;transition:width .1s}\n@media(max-width:520px){section{padding:26px 18px 20px;border-radius:18px}.topic{padding:6px 16px 14px}.part{padding:24px 20px}}\n.kws{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0 26px}\n.kw{background:var(--bg);border:1.5px solid var(--line);border-left:6px solid var(--a);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}\n.kw b{font:700 18px \"Space Grotesk\",sans-serif}\n.kw span{font-size:16px;line-height:1.55;color:var(--mute);transition:filter .15s}\n.testing .kw{cursor:pointer}\n.testing .kw:not(.show) span{filter:blur(7px);user-select:none}\n.syms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 22px}\n.sm{background:var(--tint);border-radius:14px;padding:14px 12px;text-align:center}\n.sm i{display:block;font:700 28px \"Space Grotesk\",sans-serif;font-style:normal;color:var(--a);margin-bottom:4px}\n.sm span{font-size:14.5px;line-height:1.4}\n.tst{background:var(--ink);color:var(--bg);margin:6px 0 4px}\n.testing .tst{background:var(--a);color:var(--card);border-color:var(--a)}\n.hint{font-size:14.5px;color:var(--mute);margin:4px 0 6px}\nsection.recap{border:2px solid var(--a)}\nsection.recap h2 .num{border-radius:50%}\n\n/* symbol sheet */\n.symgrid .kw{flex-direction:row;align-items:flex-start;gap:16px}\n.symgrid .kw b{flex:none;min-width:62px;text-align:center;font-size:28px;color:var(--a);line-height:1.2}\n.symgrid .kw span{line-height:1.6;color:var(--mute)}\n.symgrid .kw strong{color:var(--ink);font-family:\"Space Grotesk\",sans-serif}\n\n/* ready for a Part 3: add \u003cdiv class=\"part\"> then sections and it picks this up */\nsection.p3{--a:#c2570c;--tint:#fdeee0}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) section.p3{--a:#ffa65c;--tint:#3a2a1c}}\n:root[data-theme=\"dark\"] section.p3{--a:#ffa65c;--tint:#3a2a1c}\n.part.p3{background:linear-gradient(135deg,#7a3b0c,#d9731a)}\n\n:root{--a:#c2336f;--tint:#fbe6ef}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--a:#ff8fbd;--tint:#3b1f2d}}\n:root[data-theme=\"dark\"]{--a:#ff8fbd;--tint:#3b1f2d}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003ch1>Introduction to Computing\u003c/h1>\n\u003cp class=\"lead\">CC 111 study reader built from your weekly decks (weeks 2 to 8): computers and literacy, systems and hardware, CPU scheduling, operating systems, keyboarding and email, and web publishing. Each lesson ends with questions that explain the answer.\u003c/p>\n\u003csection id=\"l1\">\u003ch2>1. Understanding computers and computer literacy\u003c/h2>\u003cp class=\"wk\">Week 2\u003c/p>\u003cdiv class=\"def\">A \u003cb>computer\u003c/b> is an electronic system that accepts data, processes it using instructions, stores results, and produces useful output. Hardware, software, data, people, and procedures work together.\u003c/div>\u003ch3>The computing cycle\u003c/h3>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Input\u003c/td>\u003ctd>Data enters through keyboard, mouse, scanner, sensor, touch screen\u003c/td>\u003ctd>Typing a report\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Process\u003c/td>\u003ctd>CPU and software turn data into useful results\u003c/td>\u003ctd>Word processes the command\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Output\u003c/td>\u003ctd>Results appear on monitor, printer, speaker\u003c/td>\u003ctd>The screen shows the document\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>Files saved in drives, memory cards, databases, cloud\u003c/td>\u003ctd>The file is saved\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication\u003c/td>\u003ctd>Data moves through networks and the Internet\u003c/td>\u003ctd>The file is shared online\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3>Hardware, software, and data\u003c/h3>\u003cul class=\"eg\">\u003cli>\u003cb>Hardware:\u003c/b> physical parts you can touch (keyboard, monitor, CPU, printer, router, sensors).\u003c/li>\u003cli>\u003cb>Software:\u003c/b> programs and instructions (operating system, browser, office apps, antivirus). Hardware needs software, and software needs hardware.\u003c/li>\u003cli>\u003cb>Data\u003c/b> = raw facts. \u003cb>Information\u003c/b> = processed data with meaning. \u003cb>Knowledge\u003c/b> = understanding it well enough to act. Example: 32, 33, 35 °C is data; “the room is getting hotter” is information; “turn on ventilation” is knowledge.\u003c/li>\u003c/ul>\u003ch3>Computer literacy\u003c/h3>\u003cdiv class=\"def\">Knowing how to use technology wisely and effectively: use basic hardware and software confidently, find and evaluate digital information, communicate online responsibly, protect accounts, privacy and devices, and adapt to new tools.\u003c/div>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Responsible use\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Accuracy\u003c/td>\u003ctd>Check that information is correct and credible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Privacy\u003c/td>\u003ctd>Protect passwords and personal data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Respect\u003c/td>\u003ctd>Communicate politely, avoid harmful behavior\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security\u003c/td>\u003ctd>Use safe links, updates, and antivirus\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ownership\u003c/td>\u003ctd>Cite sources and avoid plagiarism\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3>Evolution of computing\u003c/h3>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>What it brought\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Early tools\u003c/td>\u003ctd>Abacus, mechanical calculators\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vacuum tubes\u003c/td>\u003ctd>Large first-generation computers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transistors\u003c/td>\u003ctd>Smaller, faster, more reliable machines\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrated circuits\u003c/td>\u003ctd>Minicomputers and stronger processing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Microprocessors\u003c/td>\u003ctd>Personal computers and mobile devices\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cloud and AI\u003c/td>\u003ctd>Connected services and intelligent systems\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Microprocessors made personal and mobile computing possible by making computers smaller and more affordable.\u003c/p>\u003ch3>Careers and daily life\u003c/h3>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Role\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Programmer / Developer\u003c/td>\u003ctd>Creates applications, websites, systems\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IT Support Specialist\u003c/td>\u003ctd>Troubleshoots computers, networks, user concerns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network Administrator\u003c/td>\u003ctd>Manages network devices and connectivity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cybersecurity Analyst\u003c/td>\u003ctd>Protects systems, data, users\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data Analyst\u003c/td>\u003ctd>Organizes and interprets data for decisions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Systems Analyst\u003c/td>\u003ctd>Studies needs and recommends solutions\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Computing appears in education, communication, banking, transportation, health, shopping, entertainment, smart homes, and public services. \u003cb>Benefits:\u003c/b> faster communication, learning access, better records, automation, data-driven decisions. \u003cb>Risks:\u003c/b> privacy concerns, misinformation, cybersecurity threats, overdependence, unequal access.\u003c/p>\u003cdiv class=\"fun\">\u003cb>Try it:\u003c/b> pick one app you use (e-wallet, online class, QR attendance). Name its input, processing, output, storage, and communication, then one benefit and one risk. That is the Week 2 assignment “Computing in My Daily Life”.\u003c/div>\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q1\">\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"l2\">\u003ch2>2. Computer systems, BIOS/UEFI and hardware\u003c/h2>\u003cp class=\"wk\">Week 3\u003c/p>\u003cdiv class=\"def\">A \u003cb>system\u003c/b> is a set of interdependent parts working toward a purpose. A computer is not one device: it is hardware, software, users and data, and procedures working together.\u003c/div>\u003ch3>IPOS and how data is processed\u003c/h3>\u003cp>\u003cb>Input\u003c/b> (data and commands enter) → \u003cb>Processing\u003c/b> (CPU and memory work on data) → \u003cb>Output\u003c/b> (results shown) → \u003cb>Storage\u003c/b> (saved for later). In five steps: Receive, Interpret, Process, Return, Save. Memory holds active data temporarily; storage keeps data even when power is off.\u003c/p>\u003ch3>Key hardware\u003c/h3>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Motherboard\u003c/td>\u003ctd>Main circuit board and “communication hub”: holds the CPU and memory, connects storage, ports, and expansion cards, distributes power\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CPU\u003c/td>\u003ctd>Fetches, decodes, executes instructions. Terms: clock speed (cycles per second), cores, cache, ALU (arithmetic and logic), control unit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAM\u003c/td>\u003ctd>Temporary working memory. Fast, volatile: contents lost without power\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage (SSD, HDD, flash)\u003c/td>\u003ctd>Long-term files and programs, non-volatile, larger but slower than RAM. SSD is fast and silent; HDD uses moving magnetic parts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GPU\u003c/td>\u003ctd>Processor optimized for graphics and parallel work\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PSU and fan\u003c/td>\u003ctd>Power supply and cooling\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3>BIOS and UEFI\u003c/h3>\u003cp>Firmware stored in non-volatile memory that runs before the operating system. It initializes essential hardware, runs startup checks (POST), reads settings, finds a bootable device, and hands control to the OS.\u003c/p>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Feature\u003c/th>\u003cth>BIOS\u003c/th>\u003cth>UEFI\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Startup firmware\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interface and features\u003c/td>\u003ctd>Limited\u003c/td>\u003ctd>More capable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Modern disk and boot features\u003c/td>\u003ctd>More limited\u003c/td>\u003ctd>Better support\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secure Boot\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Commonly available\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Used in modern PCs\u003c/td>\u003ctd>Less common\u003c/td>\u003ctd>Common\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cb>Boot process:\u003c/b> Power on → firmware initialization → hardware checks → boot device → OS loading → ready for user. Do not change firmware settings unless you know the purpose.\u003c/p>\u003ch3>Input, output, storage, peripherals\u003c/h3>\u003cul class=\"eg\">\u003cli>\u003cb>Input:\u003c/b> keyboard, mouse, touchpad, microphone, camera, scanner, touchscreen, sensors\u003c/li>\u003cli>\u003cb>Output:\u003c/b> monitor, printer, speakers, projector, haptic devices\u003c/li>\u003cli>\u003cb>Storage:\u003c/b> SSD, HDD, USB flash drives, memory cards, external drives\u003c/li>\u003cli>\u003cb>Ports:\u003c/b> USB-A and USB-C, HDMI, DisplayPort, audio, Ethernet, memory-card slot. Wireless: Wi-Fi, Bluetooth\u003c/li>\u003c/ul>\u003cp>Some devices belong to more than one category, so explain your reasoning (a touchscreen is both input and output).\u003c/p>\u003cdiv class=\"fun\">\u003cb>Case: “No boot device.”\u003c/b> The keyboard lights up, the monitor works, the UEFI screen opens, but the storage drive is not listed. Check the \u003cb>storage\u003c/b> component first. The working keyboard and monitor are evidence those parts are fine, and UEFI is useful because it shows which hardware is detected.\u003c/div>\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q2\">\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"l3\">\u003ch2>3. Computer organization and CPU scheduling\u003c/h2>\u003cp class=\"wk\">Week 4\u003c/p>\u003cdiv class=\"def\">\u003cb>Architecture\u003c/b> is what the computer does (instructions, data formats, addressing, as visible to programmers). \u003cb>Organization\u003c/b> is how the hardware units are arranged and connected to make it happen.\u003c/div>\u003cp>The CPU holds the \u003cb>control unit\u003c/b> (directs instruction flow), the \u003cb>ALU\u003c/b> (arithmetic and logic), and \u003cb>registers\u003c/b> (immediate data), with \u003cb>cache\u003c/b> to cut waiting. It works with memory, storage, input, and output, linked by buses.\u003c/p>\u003ch3>Fetch, decode, execute, store\u003c/h3>\u003cp>Fetch the next instruction from memory, decode the operation and operands, execute it, store the result. This repeats millions or billions of times per second.\u003c/p>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Address\u003c/th>\u003cth>Instruction\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003ctr>\u003ctd>00\u003c/td>\u003ctd>LOAD 10\u003c/td>\u003ctd>Load memory 10\u003c/td>\u003ctd>Accumulator = 7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>01\u003c/td>\u003ctd>ADD 11\u003c/td>\u003ctd>Add memory 11 (value 5)\u003c/td>\u003ctd>Accumulator = 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>02\u003c/td>\u003ctd>STORE 12\u003c/td>\u003ctd>Save to memory 12\u003c/td>\u003ctd>Memory 12 = 12\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3>Memory hierarchy and buses\u003c/h3>\u003cp>\u003cb>Fastest and smallest to slowest and largest:\u003c/b> Registers → Cache → RAM → SSD → HDD or archive.\u003c/p>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Bus\u003c/th>\u003cth>Carries\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Data bus\u003c/td>\u003ctd>Actual data and instructions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Address bus\u003c/td>\u003ctd>The location to read from or write to\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Control bus\u003c/td>\u003ctd>Timing and command signals (read, write, interrupt)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>In a memory read, the CPU puts \u003cb>address 10\u003c/b> on the address bus, sends a \u003cb>READ\u003c/b> on the control bus, and memory returns \u003cb>value 7\u003c/b> on the data bus.\u003c/p>\u003ch3>Processor management\u003c/h3>\u003cp>The OS creates and ends processes, schedules the next ready one, switches between them, and handles waiting and interrupts. \u003cb>States:\u003c/b> New → Ready → Running → Terminated, with Waiting (for input-output or an event) returning to Ready.\u003c/p>\u003ch3>FCFS scheduling\u003c/h3>\u003cdiv class=\"def\">\u003cb>Arrival time:\u003c/b> enters the ready queue. \u003cb>Burst time:\u003c/b> CPU time needed. \u003cb>Completion time:\u003c/b> when it finishes.\u003cbr>\u003cb>Turnaround = completion − arrival.\u003c/b> \u003cb>Waiting = turnaround − burst.\u003c/b>\u003c/div>\u003cp>\u003cb>First Come First Served:\u003c/b> order by arrival, run each to completion (non-preemptive). Simple and predictable, but a long job makes short ones wait: the \u003cb>convoy effect\u003c/b>. Order by arrival time first, then use burst time for block length.\u003c/p>\u003cp>\u003cb>Worked example:\u003c/b> P1 (0, 4), P2 (1, 3), P3 (2, 2) gives P1 0–4, P2 4–7, P3 7–9. Waiting 0, 3, 5 (average 2.67). Turnaround 4, 6, 7 (average 5.67).\u003c/p>\u003cdiv class=\"slide tool\">\u003cdiv class=\"k\">FCFS calculator: change any number\u003c/div>\u003cdiv class=\"wide\">\u003ctable id=\"fc\" style=\"min-width:0\">\u003ctr>\u003cth>Process\u003c/th>\u003cth>Arrival\u003c/th>\u003cth>Burst\u003c/th>\u003c/tr>\u003ctr class=\"fr\">\u003ctd>\u003cinput class=\"nm\" value=\"A\" style=\"width:60px\">\u003c/td>\u003ctd>\u003cinput class=\"ar\" type=\"number\" min=\"0\" value=\"0\">\u003c/td>\u003ctd>\u003cinput class=\"bu\" type=\"number\" min=\"0\" value=\"3\">\u003c/td>\u003c/tr>\u003ctr class=\"fr\">\u003ctd>\u003cinput class=\"nm\" value=\"B\" style=\"width:60px\">\u003c/td>\u003ctd>\u003cinput class=\"ar\" type=\"number\" min=\"0\" value=\"2\">\u003c/td>\u003ctd>\u003cinput class=\"bu\" type=\"number\" min=\"0\" value=\"5\">\u003c/td>\u003c/tr>\u003ctr class=\"fr\">\u003ctd>\u003cinput class=\"nm\" value=\"C\" style=\"width:60px\">\u003c/td>\u003ctd>\u003cinput class=\"ar\" type=\"number\" min=\"0\" value=\"4\">\u003c/td>\u003ctd>\u003cinput class=\"bu\" type=\"number\" min=\"0\" value=\"2\">\u003c/td>\u003c/tr>\u003ctr class=\"fr\">\u003ctd>\u003cinput class=\"nm\" value=\"D\" style=\"width:60px\">\u003c/td>\u003ctd>\u003cinput class=\"ar\" type=\"number\" min=\"0\" value=\"0\">\u003c/td>\u003ctd>\u003cinput class=\"bu\" type=\"number\" min=\"0\" value=\"0\">\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv id=\"gantt\" class=\"gantt\">\u003c/div>\u003cdiv class=\"res\" id=\"fres\" aria-live=\"polite\">\u003c/div>\u003cp style=\"font-size:15px;color:var(--mute)\">Rows with burst 0 are ignored. Default is the guided practice: A 0–3, B 3–8, C 8–10.\u003c/p>\u003c/div>\u003cdiv class=\"fun\">\u003cb>Common errors:\u003c/b> treating RAM and storage as the same thing (RAM is temporary working memory, storage is persistent). Ordering FCFS by burst time instead of arrival time. In the lab, observe settings only and do not change BIOS or UEFI values.\u003c/div>\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q3\">\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"l4\">\u003ch2>4. Operating systems and software\u003c/h2>\u003cp class=\"wk\">Week 5\u003c/p>\u003cdiv class=\"def\">An \u003cb>operating system\u003c/b> is system software that manages the computer's hardware, software, memory, and running processes, and lets the user interact with the device. Examples: Windows, macOS, Linux, Android, iOS.\u003c/div>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>OS function\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003ctr>\u003ctd>File management\u003c/td>\u003ctd>Creates, organizes, moves, renames, deletes files and folders\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Memory management\u003c/td>\u003ctd>Controls how memory is used while programs run\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Device management\u003c/td>\u003ctd>Communicates with hardware like keyboard, mouse, printer, USB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>User interface\u003c/td>\u003ctd>Screens, menus, icons, controls for the user\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Process management\u003c/td>\u003ctd>Manages the programs and tasks currently running\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3>System vs application software\u003c/h3>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>System software\u003c/th>\u003cth>Application software\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Purpose\u003c/td>\u003ctd>Manages and operates the computer\u003c/td>\u003ctd>Helps users do specific tasks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relation to hardware\u003c/td>\u003ctd>Works closely with it, provides the environment for applications\u003c/td>\u003ctd>Runs with the help of system software\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Examples\u003c/td>\u003ctd>Windows, utilities, device drivers\u003c/td>\u003ctd>Microsoft Word, PowerPoint, Chrome, VLC, Calculator\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3>Files and folders\u003c/h3>\u003cp>A \u003cb>file\u003c/b> is a collection of information saved on a computer (document, picture, video, audio, presentation). A \u003cb>folder\u003c/b> is a container that groups related files. \u003cb>Good practice:\u003c/b> clear and meaningful names, folders by category, keep related files together, avoid duplicates, save in the correct place, use a consistent naming style. Good: \u003ccode>CC111_Activity1\u003c/code>. Bad: \u003ccode>asdfgh\u003c/code>, \u003ccode>newnewnew\u003c/code>.\u003c/p>\u003cdiv class=\"fun\">\u003cb>Hands-on:\u003c/b> File Explorer → Documents → right-click an empty area → New → Folder → name it \u003ccode>CC111_Week5\u003c/code>, then add Documents, Pictures, Software. Task Manager (\u003ccode>Ctrl + Shift + Esc\u003c/code>) shows running apps and processes managed by the OS.\u003c/div>\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q4\">\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"l5\">\u003ch2>5. Keyboarding, typing accuracy and speed\u003c/h2>\u003cp class=\"wk\">Week 6\u003c/p>\u003cp>A standard keyboard has \u003cb>104 keys\u003c/b>. We type letters, numbers, and symbols by pressing them.\u003c/p>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Key group\u003c/th>\u003cth>Facts\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Alphabet keys\u003c/td>\u003ctd>26 keys, A to Z\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Number keys\u003c/td>\u003ctd>0 to 9, 10 keys. Two sets on a standard keyboard (top row and numeric keypad)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cursor control (arrow) keys\u003c/td>\u003ctd>4 keys: up, down, left, right\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spacebar\u003c/td>\u003ctd>Longest key; inserts blank spaces\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter (Return)\u003c/td>\u003ctd>New line, cursor to its start. Two Enter keys on a keyboard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Num Lock\u003c/td>\u003ctd>Activates or deactivates the numeric keypad; top-left corner of the keypad\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Function keys\u003c/td>\u003ctd>12 keys, F1 to F12, top row\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Also\u003c/td>\u003ctd>Caps Lock, Shift, Backspace and Delete\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3>Accuracy and speed\u003c/h3>\u003cp>\u003cb>Accuracy\u003c/b> = percent of correct keystrokes (aim for 95% to 100%). \u003cb>Speed\u003c/b> = words per minute (WPM).\u003c/p>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Level\u003c/th>\u003cth>WPM\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Beginner\u003c/td>\u003ctd>20–30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Good standard\u003c/td>\u003ctd>30–45\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Professional\u003c/td>\u003ctd>50–80+\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"def\">\u003cb>Key rule: accuracy first, speed will follow.\u003c/b> Best practices: home-row finger placement, eyes on the screen, proper posture, do not rush (consistency beats speed), practice daily with free tools such as monkeytype.com, 10fastfingers.com, typingtest.now.\u003c/div>\u003ch3>Hands-on activity\u003c/h3>\u003cp>On typingtest.com set difficulty to \u003cb>Easy\u003c/b> and the time to \u003cb>1 minute\u003c/b>. WPM = speed × accuracy, counting only correct words. Grades: \u003cb>36+ WPM = 100\u003c/b>, \u003cb>26–35 = 95\u003c/b>, \u003cb>25 and below = 85\u003c/b>.\u003c/p>\u003cdiv class=\"slide tool\">\u003cdiv class=\"k\">Grade calculator\u003c/div>\u003clabel>Speed (WPM) \u003cinput id=\"sp\" type=\"number\" min=\"0\" value=\"40\">\u003c/label> \u003clabel>Accuracy (%) \u003cinput id=\"ac\" type=\"number\" min=\"0\" max=\"100\" value=\"95\">\u003c/label>\u003cdiv class=\"res\" id=\"gres\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q5\">\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"l6\">\u003ch2>6. Microsoft Outlook, email management and netiquette\u003c/h2>\u003cp class=\"wk\">Week 6\u003c/p>\u003cdiv class=\"def\">\u003cb>Outlook\u003c/b> is Microsoft's personal information manager and email client: email, calendar, contacts, tasks. It works with Outlook.com, Gmail, school and work accounts. Available as desktop (Windows, Mac), web, and mobile.\u003c/div>\u003cp>\u003cb>You need:\u003c/b> full email address, password, incoming/outgoing server settings if not auto-detected (IMAP, POP3, or Exchange), and Internet.\u003c/p>\u003ch3>Add your account (desktop app)\u003c/h3>\u003col class=\"eg\">\u003cli>Open Outlook → File → Add Account\u003c/li>\u003cli>Enter your full email address\u003c/li>\u003cli>Click Connect\u003c/li>\u003cli>Enter your password → Sign in\u003c/li>\u003cli>Follow prompts → Finish\u003c/li>\u003c/ol>\u003ch3>Email management\u003c/h3>\u003cp>Keep the inbox tidy, find messages fast, never miss important mail. \u003cb>Use folders or categories\u003c/b> (school, work, personal, urgent), \u003cb>create rules\u003c/b> to auto-move mail, \u003cb>delete or archive\u003c/b> what you do not need, \u003cb>unsubscribe\u003c/b> from newsletters, and \u003cb>use search\u003c/b> by name, word, or date instead of scrolling.\u003c/p>\u003ch3>Parts of a professional email\u003c/h3>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Subject\u003c/td>\u003ctd>Short, clear, tells what the email is about (“Assignment Submission”)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recipient\u003c/td>\u003ctd>Person in the To field; check the address before sending\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Message\u003c/td>\u003ctd>Main content: clear purpose, polite and professional words\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Attachment\u003c/td>\u003ctd>A file such as a document or picture; check it is the right one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Signature\u003c/td>\u003ctd>Name, section, or key info at the end\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Netiquette\u003c/td>\u003ctd>Respect and proper manners: polite words, greetings, correct grammar, no ALL CAPS (it looks like shouting)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3>Netiquette rules\u003c/h3>\u003cul class=\"eg\">\u003cli>\u003cb>Clear subject:\u003c/b> good “Assignment — Juan Dela Cruz”; bad “Hi”, “Help”, or blank.\u003c/li>\u003cli>\u003cb>Greet and sign off:\u003c/b> start with “Dear [Name],” or “Good day,”; end with “Thank you,” or “Best regards,” plus your full name. Never skip either.\u003c/li>\u003cli>\u003cb>Do:\u003c/b> use please and thank you, stay calm and respectful, be clear and brief, one topic per email, proofread, check attachments.\u003c/li>\u003cli>\u003cb>Don't:\u003c/b> all caps, slang or emojis for school, reply when angry.\u003c/li>\u003cli>\u003cb>Respect others:\u003c/b> To = main recipient, CC = others who should know; Reply All only when needed; reply within 24 to 48 hours; do not forward without permission.\u003c/li>\u003c/ul>\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Example (model answer)\u003c/div>\u003cp>\u003cb>Subject:\u003c/b> Assignment Submission — Juan Dela Cruz\u003cbr>Dear Ma'am Santos,\u003cbr>Good day. Attached is my CC 111 assignment, “Computing in My Daily Life”. Please let me know if you cannot open the file.\u003cbr>Thank you,\u003cbr>Juan Dela Cruz, BSIT 1-A\u003c/p>\u003c/div>\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q6\">\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"l7\">\u003ch2>7. HTML, CSS, blogging and MS Publisher\u003c/h2>\u003cp class=\"wk\">Week 8\u003c/p>\u003cdiv class=\"def\">\u003cb>HTML\u003c/b> (HyperText Markup Language) is the standard markup language that gives a web page its structure and meaning. The web trio: \u003cb>HTML = skeleton\u003c/b>, \u003cb>CSS = skin and styling\u003c/b>, \u003cb>JavaScript = muscle and interactivity\u003c/b>.\u003c/div>\u003cpre>\u003ccode>&lt;!DOCTYPE html&gt;\n&lt;html&gt;\n  &lt;head&gt;\n    &lt;meta charset=\"UTF-8\"&gt;\n    &lt;title&gt;My Page&lt;/title&gt;\n  &lt;/head&gt;\n  &lt;body&gt;\n    &lt;h1&gt;Welcome!&lt;/h1&gt;\n    &lt;p&gt;Hello, world.&lt;/p&gt;\n  &lt;/body&gt;\n&lt;/html&gt;\u003c/code>\u003c/pre>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003ctr>\u003ctd>&lt;!DOCTYPE html&gt;\u003c/td>\u003ctd>Identifies the document as HTML5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&lt;html&gt;\u003c/td>\u003ctd>Root container for the whole page\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&lt;head&gt;\u003c/td>\u003ctd>Metadata: charset, title, CSS links (not visible content)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&lt;body&gt;\u003c/td>\u003ctd>The visible content: headings, paragraphs, images, links\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cb>Tag\u003c/b> = keyword in angle brackets like &lt;p&gt;. \u003cb>Element\u003c/b> = opening tag + content + closing tag. \u003cb>Attribute\u003c/b> = extra info inside the opening tag, like \u003ccode>src\u003c/code>, \u003ccode>alt\u003c/code>, \u003ccode>href\u003c/code>. Use \u003ccode>&lt;h1&gt;\u003c/code> once per page, \u003ccode>&lt;h2&gt;\u003c/code> to \u003ccode>&lt;h6&gt;\u003c/code> for subheadings, \u003ccode>&lt;p&gt;\u003c/code> for paragraphs, \u003ccode>&lt;ul&gt;\u003c/code> and \u003ccode>&lt;ol&gt;\u003c/code> for lists. Semantic elements (\u003ccode>&lt;header&gt;\u003c/code>, \u003ccode>&lt;nav&gt;\u003c/code>, \u003ccode>&lt;article&gt;\u003c/code>, \u003ccode>&lt;footer&gt;\u003c/code>) help SEO and screen readers.\u003c/p>\u003ch3>CSS\u003c/h3>\u003cp>\u003cb>Cascading Style Sheets\u003c/b> style web pages: text colors, fonts and sizes, backgrounds, borders, spacing, alignment, buttons. HTML creates the structure; CSS makes it look good.\u003c/p>\u003ch3>Blogging\u003c/h3>\u003cp>A \u003cb>blog\u003c/b> is a site where entries appear in \u003cb>reverse chronological order\u003c/b> (newest first). A \u003cb>blogger\u003c/b> creates and manages the content, often with a CMS like WordPress. Uses: personal expression, business marketing, monetization (ads, affiliate marketing, digital products). Example: the blog “Sarah's Kitchen” has posts like “How to Bake Easy Chocolate Chip Cookies in 20 Minutes”. \u003cb>How to write one:\u003c/b> plan your content, pick a topic, write a catchy title, make an outline with H2 and H3 subheadings.\u003c/p>\u003ch3>MS Publisher and desktop publishing\u003c/h3>\u003cp>\u003cb>Desktop publishing (DTP)\u003c/b> uses specialized software to design, format, and publish documents for print or digital distribution. Publisher is an entry-level DTP app for brochures, newsletters, flyers, posters, postcards. Word focuses on sequential text; Publisher focuses on page layout and visual positioning.\u003c/p>\u003cdiv class=\"wide\">\u003ctable>\u003ctr>\u003cth>Concept\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Frame-based editing\u003c/td>\u003ctd>Text, images, shapes live in movable boxes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Templates, guides, master pages\u003c/td>\u003ctd>Ready layouts, alignment tools, consistent headers/footers/page numbers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Page layout and visual hierarchy\u003c/td>\u003ctd>Arrangement of elements; size, color, weight, placement guide the eye\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RGB vs CMYK\u003c/td>\u003ctd>RGB for screens; CMYK (Cyan, Magenta, Yellow, Key/Black) for commercial printing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bleed and margin\u003c/td>\u003ctd>Margins keep content safe; bleed extends images past the edge to avoid white borders after trimming\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cb>Workflow:\u003c/b> choose a template or blank layout → insert objects and frames → format, align, structure → export. Save \u003cb>.pub\u003c/b> as the editable master; export to \u003cb>PDF\u003c/b> (high-resolution sharing and print) or \u003cb>JPG/PNG\u003c/b> (digital images).\u003c/p>\u003cdiv class=\"fun\">\u003cb>Takeaway:\u003c/b> HTML builds the structure, CSS controls the look, blogging organizes and publishes content, Publisher arranges text and graphics. Good digital work needs clear structure, intentional design, readable hierarchy, and the right publishing format.\u003c/div>\u003cdiv class=\"slide\">\u003cdiv class=\"k\">Check yourself\u003c/div>\u003cdiv id=\"q7\">\u003c/div>\u003c/div>\u003c/section>\u003csection id=\"l8\" class=\"recap\">\u003ch2>Quick keywords\u003c/h2>\u003cp>The whole course so far in one page. Tap “test yourself” to hide the meanings, then tap a card to check.\u003c/p>\u003cbutton class=\"tst\" type=\"button\">Test yourself: hide the meanings\u003c/button>\u003cdiv class=\"kws\">\u003cdiv class=\"kw\">\u003cb>Computer\u003c/b>\u003cspan>Electronic system: accepts data, processes it, stores results, gives output\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>IPOS\u003c/b>\u003cspan>Input, Processing, Output, Storage\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Data vs information\u003c/b>\u003cspan>Data is raw facts; information is processed data with meaning\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Computer literacy\u003c/b>\u003cspan>Effective, responsible, safe, adaptable use of technology\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Microprocessor\u003c/b>\u003cspan>Made personal and mobile computers small and affordable\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Motherboard\u003c/b>\u003cspan>Main board and “communication hub” connecting all parts\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>CPU\u003c/b>\u003cspan>Fetches, decodes, executes instructions (control unit + ALU + registers)\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>RAM\u003c/b>\u003cspan>Temporary, volatile working memory\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Storage\u003c/b>\u003cspan>Non-volatile long-term space: SSD, HDD, flash\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>BIOS / UEFI\u003c/b>\u003cspan>Firmware that starts the hardware and boots the OS; UEFI is the modern one\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>POST\u003c/b>\u003cspan>Startup hardware checks\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Architecture vs organization\u003c/b>\u003cspan>What it does vs how the hardware makes it happen\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Data / address / control bus\u003c/b>\u003cspan>Carry data / the location / timing and commands\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Memory hierarchy\u003c/b>\u003cspan>Registers, cache, RAM, SSD, HDD: fastest/smallest to slowest/largest\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Process states\u003c/b>\u003cspan>New, Ready, Running, Waiting, Terminated\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Turnaround time\u003c/b>\u003cspan>Completion − arrival\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Waiting time\u003c/b>\u003cspan>Turnaround − burst\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>FCFS\u003c/b>\u003cspan>Run in arrival order; convoy effect hurts short jobs\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Operating system\u003c/b>\u003cspan>System software managing hardware, memory, processes, files\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>OS functions\u003c/b>\u003cspan>File, memory, device, user interface, process management\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>System vs application software\u003c/b>\u003cspan>Runs the computer vs does user tasks (Word, Chrome)\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>File vs folder\u003c/b>\u003cspan>File holds data; folder groups related files\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>WPM\u003c/b>\u003cspan>Words per minute; 36+ WPM = 100 in the activity\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Netiquette\u003c/b>\u003cspan>Respectful, clear, professional online behavior\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>To vs CC\u003c/b>\u003cspan>Main recipient vs others who should know\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>HTML / CSS / JS\u003c/b>\u003cspan>Structure / look / behavior\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Blog\u003c/b>\u003cspan>Entries in reverse chronological order\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>RGB vs CMYK\u003c/b>\u003cspan>Screens vs commercial printing\u003c/span>\u003c/div>\u003cdiv class=\"kw\">\u003cb>Bleed\u003c/b>\u003cspan>Image extends past the edge so trimming leaves no white border\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\n\u003cscript>\nconst T=[\"Computers\",\"Systems & hardware\",\"CPU & FCFS\",\"Operating systems\",\"Keyboarding\",\"Outlook & netiquette\",\"HTML & Publisher\",\"Keywords\"];\ndocument.getElementById(\"nav\").innerHTML=T.map((t,i)=>`\u003ca class=\"chip\" href=\"#l${i+1}\">${i+1}. ${t}\u003c/a>`).join(\"\");\nconst QS={q1:[[\"Which is an example of storage in a smartphone app?\", [\"Typing a message\", \"Saving a file to cloud storage\", \"Showing the screen\"], 1, \"Storage means files are saved for later: drives, memory cards, cloud.\"], [\"Raw facts such as 32, 33, 35 °C are…\", [\"Information\", \"Data\", \"Knowledge\"], 1, \"Data is raw facts. Processing gives information; acting on it uses knowledge.\"], [\"What made personal and mobile computing possible?\", [\"Abacus\", \"Vacuum tubes\", \"Microprocessors\"], 2, \"Microprocessors made computers smaller and more affordable.\"], [\"Which role troubleshoots computers, networks, and users' concerns?\", [\"IT support specialist\", \"Data analyst\", \"Systems analyst\"], 0, \"IT support handles troubleshooting; data analysts interpret data.\"]],q2:[[\"RAM is called volatile because…\", [\"It is slow\", \"Its contents are lost when power is removed\", \"It stores the OS permanently\"], 1, \"RAM only holds data while powered.\"], [\"What does BIOS/UEFI do first?\", [\"Opens a browser\", \"Initializes hardware and finds a boot device\", \"Saves your files\"], 1, \"Firmware prepares the computer to start before the OS loads.\"], [\"A printer in IPOS is…\", [\"Input\", \"Processing\", \"Output\"], 2, \"It presents results as hard copy.\"], [\"Correct order of the cycle?\", [\"Input, processing, output, storage\", \"Storage, input, output, processing\", \"Processing, input, storage, output\"], 0, \"IPOS: input, processing, output, storage.\"], [\"Classify a USB flash drive.\", [\"Input\", \"Output\", \"Storage\"], 2, \"It keeps data without power.\"], [\"Classify a headset with a microphone.\", [\"Output only\", \"Input and output\", \"Storage\"], 1, \"Speakers give output and the mic gives input.\"], [\"“No boot device” with a working UEFI screen. Check first…\", [\"The monitor\", \"The storage drive\", \"The keyboard\"], 1, \"The drive is not listed in firmware, so check storage first.\"]],q3:[[\"Which bus carries the location of data?\", [\"Data bus\", \"Address bus\", \"Control bus\"], 1, \"The address bus identifies where to read or write.\"], [\"LOAD 10 (7), ADD 11 (5), STORE 12 puts what in memory 12?\", [\"7\", \"5\", \"12\"], 2, \"7 + 5 = 12.\"], [\"Under FCFS, what decides the order?\", [\"Burst time\", \"Arrival time\", \"Process name\"], 1, \"First come, first served: arrival order.\"], [\"P1 arrives 0 with burst 4; P2 arrives 1 with burst 3. P2 waiting time?\", [\"3\", \"4\", \"1\"], 0, \"P2 starts at 4, so waiting = 4 − 1 = 3.\"], [\"Waiting time equals…\", [\"Completion − arrival\", \"Turnaround − burst\", \"Burst − arrival\"], 1, \"Turnaround = completion − arrival, then waiting = turnaround − burst.\"]],q4:[[\"What is an operating system?\", [\"A game\", \"System software that manages a computer\", \"A picture\"], 1, \"It manages hardware, memory, and processes.\"], [\"Which is application software?\", [\"Windows\", \"Device driver\", \"Microsoft Word\"], 2, \"Apps help users perform specific tasks.\"], [\"Which OS function manages running programs?\", [\"Process management\", \"File management\", \"Printing\"], 0, \"Process management tracks programs and tasks that are running.\"], [\"Which is a good file name?\", [\"asdfgh\", \"CC111_Activity1\", \"newnewnew\"], 1, \"Clear and meaningful names are easy to find.\"], [\"Google Chrome is…\", [\"System software\", \"Application software\", \"An operating system\"], 1, \"It is used directly by the user to browse.\"]],q5:[[\"How many function keys are on a standard keyboard?\", [\"10\", \"12\", \"26\"], 1, \"F1 to F12, in the top row.\"], [\"What does Num Lock do?\", [\"Locks capital letters\", \"Activates or deactivates the numeric keypad\", \"Moves the cursor\"], 1, \"It is at the top-left of the keypad.\"], [\"Key rule for typing?\", [\"Speed first\", \"Accuracy first, speed will follow\", \"Look at the keys\"], 1, \"Accuracy first.\"], [\"26 to 35 WPM earns…\", [\"100\", \"95\", \"85\"], 1, \"36+ = 100, 26–35 = 95, 25 and below = 85.\"]],q6:[[\"Which is a good subject line?\", [\"Hi\", \"Help\", \"Assignment — Juan Dela Cruz\"], 2, \"Specific and short.\"], [\"CC means…\", [\"Main recipient\", \"Others who should know\", \"Attachment\"], 1, \"To is the main recipient; CC is for others to know.\"], [\"ALL CAPITAL LETTERS in email look like…\", [\"Politeness\", \"Shouting\", \"A signature\"], 1, \"Avoid all caps.\"], [\"How soon should you reply?\", [\"Within 24 to 48 hours\", \"Within a month\", \"Never\"], 0, \"A reasonable reply time is part of netiquette.\"]],q7:[[\"Which element holds the visible content of a page?\", [\"\u003chead>\", \"\u003cbody>\", \"\u003chtml>\"], 1, \"\u003cbody> has headings, paragraphs, images, links.\"], [\"Which language controls how a page looks?\", [\"HTML\", \"CSS\", \"JavaScript\"], 1, \"CSS handles colors, fonts, spacing, layout.\"], [\"Blog posts are usually arranged…\", [\"Oldest first\", \"Newest first\", \"Randomly\"], 1, \"Reverse chronological order.\"], [\"Which color model is for commercial printing?\", [\"RGB\", \"CMYK\", \"HTML\"], 1, \"RGB is for screens, CMYK for print.\"]]};\nObject.keys(QS).forEach(id=>{\n const box=document.getElementById(id);\n QS[id].forEach(([q,opts,ans,why])=>{\n  const d=document.createElement(\"div\");d.className=\"q\";\n  d.innerHTML='\u003cdiv>\u003c/div>\u003cdiv class=\"o\">\u003c/div>\u003cdiv class=\"why\" aria-live=\"polite\">\u003c/div>';\n  d.firstChild.textContent=q;\n  const o=d.querySelector(\".o\"),w=d.querySelector(\".why\");\n  opts.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;\n   b.onclick=()=>{[...o.children].forEach(x=>x.className=\"\");b.className=i===ans?\"good\":\"bad\";w.textContent=(i===ans?\"Correct. \":\"Not quite. \")+why};o.appendChild(b)});\n  box.appendChild(d);\n });\n});\nfunction fcfs(){\n const ps=[...document.querySelectorAll(\"#fc .fr\")].map(r=>({n:r.querySelector(\".nm\").value||\"?\",a:+r.querySelector(\".ar\").value||0,b:+r.querySelector(\".bu\").value||0})).filter(p=>p.b>0).sort((x,y)=>x.a-y.a);\n const g=document.getElementById(\"gantt\"),res=document.getElementById(\"fres\");\n if(!ps.length){g.innerHTML=\"\";res.textContent=\"Enter at least one process with a burst time.\";return}\n let t=0,segs=[],rows=[],sw=0,st=0;\n ps.forEach(p=>{const s=Math.max(t,p.a);if(s>t)segs.push({n:\"idle\",s:t,e:s,idle:1});const c=s+p.b,ta=c-p.a,w=ta-p.b;segs.push({n:p.n,s:s,e:c});rows.push(p.n+\": completion \"+c+\", turnaround \"+ta+\", waiting \"+w);sw+=w;st+=ta;t=c});\n g.innerHTML=segs.map(x=>'\u003cdiv class=\"'+(x.idle?\"idle\":\"\")+'\" style=\"flex:'+(x.e-x.s)+'\">'+x.n+'\u003csmall>'+x.s+\"–\"+x.e+\"\u003c/small>\u003c/div>\").join(\"\");\n res.innerHTML=rows.join(\"\u003cbr>\")+\"\u003cbr>Average waiting: \"+(sw/ps.length).toFixed(2)+\"\u003cbr>Average turnaround: \"+(st/ps.length).toFixed(2);\n}\ndocument.querySelectorAll(\"#fc input\").forEach(i=>i.addEventListener(\"input\",fcfs));fcfs();\nfunction grade(){\n const sp=+document.getElementById(\"sp\").value||0,ac=+d arch\u003c/a>\u003ca href=\"#ch6-s3\" class=\"sub-link\" data-target=\"ch6-s3\">Bubble Sort\u003c/a>\u003ca href=\"#ch6-s4\" class=\"sub-link\" data-target=\"ch6-s4\">Insertion Sort\u003c/a>\u003ca href=\"#ch6-s5\" class=\"sub-link\" data-target=\"ch6-s5\">Selection Sort\u003c/a>\u003ca href=\"#ch6-s6\" class=\"sub-link\" data-target=\"ch6-s6\">Merge Sort\u003c/a>\u003ca href=\"#ch6-s7\" class=\"sub-link\" data-target=\"ch6-s7\">Programming Exercises\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"nav-chapter\">\u003ca href=\"#ch7\" class=\"chap-link\" data-target=\"ch7\">Text Files\u003c/a>\u003cdiv class=\"nav-subs\">\u003ca href=\"#ch7-s0\" class=\"sub-link\" data-target=\"ch7-s0\">Overview\u003c/a>\u003ca href=\"#ch7-s1\" class=\"sub-link\" data-target=\"ch7-s1\">Reading From Text Files\u003c/a>\u003ca href=\"#ch7-s2\" class=\"sub-link\" data-target=\"ch7-s2\">Writing to Text Files\u003c/a>\u003ca href=\"#ch7-s3\" class=\"sub-link\" data-target=\"ch7-s3\">Returning Filenames from Functions\u003c/a>\u003ca href=\"#ch7-s4\" class=\"sub-link\" data-target=\"ch7-s4\">Programming Exercises\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"nav-chapter\">\u003ca href=\"#ch8\" class=\"chap-link\" data-target=\"ch8\">Structures &amp; Unions\u003c/a>\u003cdiv class=\"nav-subs\">\u003ca href=\"#ch8-s0\" class=\"sub-link\" data-target=\"ch8-s0\">Overview\u003c/a>\u003ca href=\"#ch8-s1\" class=\"sub-link\" data-target=\"ch8-s1\">Declaring a Structure &amp; Accessing Members\u003c/a>\u003ca href=\"#ch8-s2\" class=\"sub-link\" data-target=\"ch8-s2\">Array of Structures\u003c/a>\u003ca href=\"#ch8-s3\" class=\"sub-link\" data-target=\"ch8-s3\">Passing &amp; Returning Structures\u003c/a>\u003ca href=\"#ch8-s4\" class=\"sub-link\" data-target=\"ch8-s4\">Unions in C\u003c/a>\u003ca href=\"#ch8-s5\" class=\"sub-link\" data-target=\"ch8-s5\">Programming Exercises\u003c/a>\u003c/div>\u003c/div>\n  \u003c/aside>\n  \u003cmain>\n    \u003cdiv class=\"masthead\">\n      \u003cdiv class=\"eyebrow\">Introduction to Computing &middot; Programming 1\u003c/div>\n      \u003ch1>C Programming Reference Wiki\u003c/h1>\n      \u003cp>A single reference built from the course workbook pages &mdash; covering C fundamentals, input/output,\n      selection structures, functions and storage classes, arrays, searching and sorting, text files, and\n      structures/unions. Use the sidebar to jump straight to any topic.\u003c/p>\n    \u003c/div>\n    \n    \u003csection class=\"chapter\" id=\"ch1\">\n      \u003ch2>Introduction to C\u003c/h2>\n      \n    \u003csection class=\"entry\" id=\"ch1-s0\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Why C?\u003c/h3>\n        \u003cspan class=\"pageref\">p.18\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>C is a popular language created by Dennis Ritchie in the 1970s, originally built for system-level\n   development. It gives direct access to memory while still offering enough abstraction for building\n   applications, which is why it remains a cornerstone of modern computing.\u003c/p>\n   \u003cp>Reasons it is still widely used:\u003c/p>\n   \u003col>\n     \u003cli>\u003cb>Efficiency &amp; performance\u003c/b> &mdash; low-level access to hardware, ideal for operating systems, embedded systems, and real-time software.\u003c/li>\n     \u003cli>\u003cb>Portability\u003c/b> &mdash; standards like ANSI C let code run across systems with little modification.\u003c/li>\n     \u003cli>\u003cb>System programming\u003c/b> &mdash; suited for device drivers, kernel modules, OS components.\u003c/li>\n     \u003cli>\u003cb>Legacy code\u003c/b> &mdash; huge amounts of existing software still need C maintenance.\u003c/li>\n     \u003cli>\u003cb>Embedded systems\u003c/b> &mdash; low resource usage, direct hardware access.\u003c/li>\n     \u003cli>\u003cb>Hardware interfacing\u003c/b> &mdash; bitwise operations and memory address manipulation.\u003c/li>\n     \u003cli>\u003cb>Education\u003c/b> &mdash; simple enough to teach core programming concepts.\u003c/li>\n   \u003c/ol>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch1-s1\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Data Types\u003c/h3>\n        \u003cspan class=\"pageref\">p.18&ndash;19\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>C provides five fundamental data types:\u003c/p>\n   \u003cul>\n     \u003cli>\u003cb>char\u003c/b> &mdash; a single character, stored as an 8-bit ASCII value.\u003c/li>\n     \u003cli>\u003cb>int\u003c/b> &mdash; whole numbers, no decimal points.\u003c/li>\n     \u003cli>\u003cb>float\u003c/b> and \u003cb>double\u003c/b> &mdash; real numbers with integer and fractional parts; \u003ccode>double\u003c/code> offers higher precision than \u003ccode>float\u003c/code>.\u003c/li>\n     \u003cli>\u003cb>void\u003c/b> &mdash; used in three ways: to mark that a function returns no value, to mark that a function takes no parameters, and to declare a generic pointer (\u003ccode>void*\u003c/code>) that can point to any data type.\u003c/li>\n   \u003c/ul>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch1-s2\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Type Modifiers\u003c/h3>\n        \u003cspan class=\"pageref\">p.19\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>Modifiers alter the properties of basic data types (except \u003ccode>void\u003c/code>) &mdash; e.g. adjusting range or storage size.\n   Common modifiers: \u003ccode>signed\u003c/code>, \u003ccode>unsigned\u003c/code>, \u003ccode>short\u003c/code>, \u003ccode>long\u003c/code>. These combine with\n   \u003ccode>int\u003c/code>, \u003ccode>char\u003c/code>, \u003ccode>double\u003c/code> to create more specific types.\u003c/p>\n   \u003ctable class=\"ref\">\n    \u003ctr>\u003cth>Modified type\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>signed int\u003c/td>\u003ctd>Default integer type; stores positive and negative values\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>unsigned int\u003c/td>\u003ctd>Stores only non-negative integers\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>short int\u003c/td>\u003ctd>Smaller range (uses less memory)\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>unsigned short int\u003c/td>\u003ctd>Non-negative short integers\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>long int\u003c/td>\u003ctd>Larger range of integers\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>unsigned long int\u003c/td>\u003ctd>Non-negative long integers\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>signed char\u003c/td>\u003ctd>Character type that can store negative values\u003c/td>\u003c/tr>\n   \u003c/table>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch1-s3\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Keywords\u003c/h3>\n        \u003cspan class=\"pageref\">p.19&ndash;20\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>Keywords are reserved terms with built-in meaning &mdash; they can't be reused as variable or function names.\u003c/p>\n   \u003cdiv class=\"kwgrid\">\n    auto&nbsp;&nbsp;break&nbsp;&nbsp;case&nbsp;&nbsp;char&nbsp;&nbsp;const&nbsp;&nbsp;continue&nbsp;&nbsp;default&nbsp;&nbsp;\n    else&nbsp;&nbsp;enum&nbsp;&nbsp;extern&nbsp;&nbsp;float&nbsp;&nbsp;for&nbsp;&nbsp;goto&nbsp;&nbsp;if&nbsp;&nbsp;\n    long&nbsp;&nbsp;register&nbsp;&nbsp;return&nbsp;&nbsp;short&nbsp;&nbsp;signed&nbsp;&nbsp;sizeof&nbsp;&nbsp;static&nbsp;&nbsp;\n    switch&nbsp;&nbsp;typedef&nbsp;&nbsp;union&nbsp;&nbsp;unsigned&nbsp;&nbsp;void&nbsp;&nbsp;volatile&nbsp;&nbsp;while\n   \u003c/div>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch1-s4\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Identifiers &amp; Variables\u003c/h3>\n        \u003cspan class=\"pageref\">p.20\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>An \u003cb>identifier\u003c/b> is a name for a variable, function, array, or other user-defined element. Rules: must\n   start with a letter or underscore, followed by letters/digits/underscores; C is case-sensitive (\u003ccode>Manpower\u003c/code>\n   &ne; \u003ccode>manpower\u003c/code>); no spaces or special characters like \u003ccode>@ $ %\u003c/code>.\u003c/p>\n   \u003cp>A \u003cb>variable\u003c/b> is an identifier used to store data that can change during execution.\u003c/p>\n   \u003cp>\u003cb>Naming rules:\u003c/b> use only letters/digits/underscores; names can't start with a digit; don't redefine\n   standard-library identifiers; case-sensitive; no spaces; avoid reserved keywords; avoid reusing existing function names.\u003c/p>\n   \u003cdiv class=\"code\">int i, j, k;\nshort i, j, k;\u003c/div>\n   \u003cp>\u003cb>Two kinds of variables:\u003c/b>\u003c/p>\n   \u003cul>\n     \u003cli>\u003cb>Local variables\u003c/b> &mdash; declared inside a function/block; only usable there.\u003c/li>\n     \u003cli>\u003cb>Global variables\u003c/b> &mdash; declared outside all functions; usable/modifiable anywhere in the program.\u003c/li>\n   \u003c/ul>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch1-s5\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Constants\u003c/h3>\n        \u003cspan class=\"pageref\">p.21\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>Constants are identifiers that store fixed values that cannot change during execution.\u003c/p>\n   \u003cdiv class=\"code\">const int count = 100;\u003c/div>\n   \u003cp>\u003ci>integer \u003ccode>count\u003c/code> has a fixed value of 100.\u003c/i>\u003c/p>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch1-s6\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Operators: Arithmetic &amp; Assignment\u003c/h3>\n        \u003cspan class=\"pageref\">p.21, 28&ndash;29\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>An \u003cb>operator\u003c/b> is a symbol that tells the compiler to carry out a specific math or logic operation.\u003c/p>\n   \u003ctable class=\"ref\">\n    \u003ctr>\u003cth>Operator\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>+\u003c/td>\u003ctd>Addition\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>-\u003c/td>\u003ctd>Subtraction\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>*\u003c/td>\u003ctd>Multiplication\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>/\u003c/td>\u003ctd>Division\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%\u003c/td>\u003ctd>Modulus (remainder)\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>--\u003c/td>\u003ctd>Decrement\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>++\u003c/td>\u003ctd>Increment\u003c/td>\u003c/tr>\n   \u003c/table>\n   \u003cp>\u003cb>Assignment\u003c/b> stores a value in a variable using \u003ccode>=\u003c/code>, which copies the right-hand result into the left-hand variable.\u003c/p>\n   \u003ctable class=\"ref\">\n    \u003ctr>\u003cth>Operator\u003c/th>\u003cth>Description\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>=\u003c/td>\u003ctd>Basic assignment\u003c/td>\u003ctd>\u003ccode>C = A + B;\u003c/code>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>+=\u003c/td>\u003ctd>Add and assign\u003c/td>\u003ctd>\u003ccode>C += A;\u003c/code> same as \u003ccode>C = C + A;\u003c/code>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>-=\u003c/td>\u003ctd>Subtract and assign\u003c/td>\u003ctd>\u003ccode>C -= A;\u003c/code>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>*=\u003c/td>\u003ctd>Multiply and assign\u003c/td>\u003ctd>\u003ccode>C *= A;\u003c/code>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>/=\u003c/td>\u003ctd>Divide and assign\u003c/td>\u003ctd>\u003ccode>C /= A;\u003c/code>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%=\u003c/td>\u003ctd>Modulus and assign\u003c/td>\u003ctd>\u003ccode>C %= A;\u003c/code>\u003c/td>\u003c/tr>\n   \u003c/table>\n   \u003cp>Examples: \u003ccode>x = 1;\u003c/code> &middot; \u003ccode>a = b;\u003c/code> &middot; \u003ccode>int x = 10;\u003c/code> &middot; \u003ccode>float y = 3.14;\u003c/code>\u003c/p>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch1-s7\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Math Library Functions\u003c/h3>\n        \u003cspan class=\"pageref\">p.29&ndash;30\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>Available through \u003ccode>math.h\u003c/code>:\u003c/p>\n   \u003cul>\n     \u003cli>\u003ccode>sqrt(x)\u003c/code> &mdash; square root of x\u003c/li>\n     \u003cli>\u003ccode>pow(x, y)\u003c/code> &mdash; x raised to the power y\u003c/li>\n     \u003cli>\u003ccode>sin(x), cos(x), tan(x)\u003c/code> &mdash; trig functions (radians)\u003c/li>\n     \u003cli>\u003ccode>log(x), log10(x)\u003c/code> &mdash; natural and base-10 logarithm\u003c/li>\n     \u003cli>\u003ccode>fabs(x)\u003c/code> &mdash; absolute value\u003c/li>\n     \u003cli>\u003ccode>ceil(x), floor(x)\u003c/code> &mdash; round up / down to nearest whole number\u003c/li>\n   \u003c/ul>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch1-s8\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Expressions &amp; Type Conversion\u003c/h3>\n        \u003cspan class=\"pageref\">p.30\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>An \u003cb>expression\u003c/b> is a combination of variables, constants, and operators that evaluates to one value.\u003c/p>\n   \u003cdiv class=\"code\">i = i + 1;              // increases i by 1\nint a = 5, b = 3;\nint result = a + b * 2; // multiplication first: 5 + (3*2) = 11\u003c/div>\n   \u003cp>\u003cb>Implicit conversion (type promotion)\u003c/b> happens automatically when mixed types appear in one expression:\u003c/p>\n   \u003cdiv class=\"code\">int a = 5;\nfloat b = 2.0;\nfloat result = a + b;  // a promoted to float, result = 7.0\u003c/div>\n   \u003cp>\u003cb>Explicit conversion (typecasting)\u003c/b> is done manually with a cast operator: \u003ccode>(type_name) expression\u003c/code>\u003c/p>\n   \u003cdiv class=\"code\">int a = 5, b = 2;\nfloat result = (float) a / b;  // 2.5 instead of integer division's 2\u003c/div>\n   \u003ctable class=\"ref\">\n    \u003ctr>\u003cth>From\u003c/th>\u003cth>To\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>int\u003c/td>\u003ctd>float\u003c/td>\u003ctd>(float) 5 = 5.0\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>float\u003c/td>\u003ctd>int\u003c/td>\u003ctd>(int) 5.9 = 5\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>char\u003c/td>\u003ctd>int\u003c/td>\u003ctd>'A' = 65\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>int\u003c/td>\u003ctd>char\u003c/td>\u003ctd>65 = 'A'\u003c/td>\u003c/tr>\n   \u003c/table>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003c/section>\n    \n    \u003csection class=\"chapter\" id=\"ch2\">\n      \u003ch2>Processing &amp; Interactive Input/Output\u003c/h2>\n      \n    \u003csection class=\"entry\" id=\"ch2-s0\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Overview\u003c/h3>\n        \u003cspan class=\"pageref\">p.27\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>Input and output in C are handled through standard streams: \u003ccode>stdin\u003c/code> (usually keyboard) and\n   \u003ccode>stdout\u003c/code> (usually screen). This chapter covers input/output statements, format specifiers,\n   testing, and debugging.\u003c/p>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch2-s1\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Interactive Input Functions\u003c/h3>\n        \u003cspan class=\"pageref\">p.31&ndash;32\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cul>\n    \u003cli>\u003ccode>getch()\u003c/code> &mdash; reads one character, doesn't show it. \u003ccode>ch = getch();\u003c/code>\u003c/li>\n    \u003cli>\u003ccode>getche()\u003c/code> &mdash; reads one character and displays it (like READLN in Pascal). \u003ccode>ch = getche();\u003c/code>\u003c/li>\n    \u003cli>\u003ccode>getchar()\u003c/code> &mdash; reads one character, echoes it, waits for Enter. \u003ccode>ch = getchar();\u003c/code>\u003c/li>\n    \u003cli>\u003ccode>fgets()\u003c/code> &mdash; reads a string including spaces, until newline or limit. \u003ccode>fgets(ch, sizeof(ch), stdin);\u003c/code>\n        Safer than \u003ccode>gets()\u003c/code>, which doesn't check buffer size and can overflow.\u003c/li>\n    \u003cli>\u003ccode>scanf()\u003c/code> &mdash; reads formatted input; doesn't accept spaces in string input; stops at a space.\n        \u003ccode>scanf(\"%d\", &amp;num);\u003c/code>\u003c/li>\n   \u003c/ul>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch2-s2\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Interactive Output Functions\u003c/h3>\n        \u003cspan class=\"pageref\">p.32&ndash;33\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cul>\n    \u003cli>\u003ccode>printf()\u003c/code> &mdash; displays formatted output using format specifiers. \u003ccode>printf(\"Hello, %s, you are %d years old\", name, age);\u003c/code>\u003c/li>\n    \u003cli>\u003ccode>putchar()\u003c/code> &mdash; prints a single character; can transform it too. \u003ccode>putchar(tolower(ch));\u003c/code>\u003c/li>\n    \u003cli>\u003ccode>puts()\u003c/code> &mdash; displays a string; unlike \u003ccode>printf()\u003c/code>, needs no format specifiers. \u003ccode>puts(\"hello\");\u003c/code>\u003c/li>\n   \u003c/ul>\n   \u003cdiv class=\"code\">#include &lt;stdio.h&gt;\nint main() {\n  printf(\"Hello, World!\\n\");\n  return 0;\n}\u003c/div>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch2-s3\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Format Specifiers\u003c/h3>\n        \u003cspan class=\"pageref\">p.33\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003ctable class=\"ref\">\n    \u003ctr>\u003cth>Specifier\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>%c\u003c/td>\u003ctd>Single character\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%d\u003c/td>\u003ctd>Decimal (integer)\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%e\u003c/td>\u003ctd>Scientific notation\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%f\u003c/td>\u003ctd>Floating point\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%o\u003c/td>\u003ctd>Octal number\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%s\u003c/td>\u003ctd>String\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%u\u003c/td>\u003ctd>Unsigned integer\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%x / %X\u003c/td>\u003ctd>Hexadecimal (lower/upper case)\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>%%\u003c/td>\u003ctd>Prints a literal percent sign\u003c/td>\u003c/tr>\n   \u003c/table>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch2-s4\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Escape Sequences &amp; Symbolic Constants\u003c/h3>\n        \u003cspan class=\"pageref\">p.34\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>Escape sequences represent characters that are hard to type directly: \u003ccode>\\\\\u003c/code> backslash,\n   \u003ccode>\\'\u003c/code> single quote, \u003ccode>\\\"\u003c/code> double quote, \u003ccode>\\?\u003c/code> question mark, \u003ccode>\\n\u003c/code> newline.\u003c/p>\n   \u003cp>\u003cb>Symbolic constants\u003c/b> are identifiers for fixed values that can't be changed during execution &mdash;\n   they make code more readable, maintainable, and easier to update.\u003c/p>\n   \u003cdiv class=\"code\">// 1. Using #define\n#define PI 3.14159\n#define MAX_SIZE 100   // replaces every PI with 3.14159 before compilation; no memory allocated\n\n// 2. Using const\nconst float pi = 3.14159;    // creates a typed constant variable; memory is allocated and type-checked\nconst int maxSize = 100;\u003c/div>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch2-s5\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Testing &amp; Debugging\u003c/h3>\n        \u003cspan class=\"pageref\">p.34&ndash;35\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>Testing checks whether a program works correctly under different conditions; debugging locates and fixes\n   bugs so the program runs smoothly and produces expected results.\u003c/p>\n   \u003cp>\u003cb>Common bugs in C:\u003c/b>\u003c/p>\n   \u003col>\n    \u003cli>\u003cb>Segmentation faults\u003c/b> &mdash; accessing memory the program has no permission to use; usually crashes or misbehaves.\u003c/li>\n    \u003cli>\u003cb>Buffer overflows\u003c/b> &mdash; writing more data to a fixed-size buffer than it can hold, overwriting adjacent memory.\u003c/li>\n    \u003cli>\u003cb>Memory leaks\u003c/b> &mdash; allocating memory dynamically (malloc/calloc/realloc) but never releasing it with \u003ccode>free()\u003c/code>.\u003c/li>\n    \u003cli>\u003cb>Logic errors\u003c/b> &mdash; the program compiles and runs but produces the wrong output because of a design/algorithm mistake.\u003c/li>\n    \u003cli>\u003cb>Uninitialized variables\u003c/b> &mdash; a declared variable used before being given a value; C doesn't auto-initialize, so it may hold garbage data.\u003c/li>\n   \u003c/ol>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch2-s6\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Worked Examples\u003c/h3>\n        \u003cspan class=\"pageref\">p.35, 37\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cdiv class=\"code\">// Displays 3 lines\n#include &lt;stdio.h&gt;\nint main() {\n  printf(\"Hello \\n\");\n  printf(\"I'm Fine \\n\");\n  printf(\"Thank you \\n\");\n  return 0;\n}\n// Output: Hello / I'm Fine / Thank you\u003c/div>\n   \u003cdiv class=\"code\">// Takes name + age, displays both\n#include &lt;stdio.h&gt;\nint main() {\n  int age; char name[10];\n  printf(\"\\n Enter Name: \");  scanf(\"%s\", &amp;name);\n  printf(\"\\n Enter Age: \");   scanf(\"%d\", &amp;age);\n  printf(\"\\n Hello %s, you are %d years old\", name, age);\n  return 0;\n}\u003c/div>\n   \u003cp>\u003cb>Tracing exercise\u003c/b> &mdash; given a, b as inputs, the program computes: \u003ccode>s=a+b\u003c/code> (sum),\n   \u003ccode>d=a-b\u003c/code> (difference), \u003ccode>p=a*b\u003c/code> (product), \u003ccode>q=(float)a/b\u003c/code> (quotient),\n   \u003ccode>r=a%b\u003c/code> (remainder), then prints all five results.\u003c/p>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003c/section>\n    \n    \u003csection class=\"chapter\" id=\"ch3\">\n      \u003ch2>Selection Structures\u003c/h2>\n      \n    \u003csection class=\"entry\" id=\"ch3-s0\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Overview\u003c/h3>\n        \u003cspan class=\"pageref\">p.38\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>Selection structures let a program make decisions based on conditions, executing different code blocks\n   depending on whether a condition is true or false.\u003c/p>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch3-s1\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Relational &amp; Logical Operators\u003c/h3>\n        \u003cspan class=\"pageref\">p.40\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003ctable class=\"ref\">\n    \u003ctr>\u003cth>Operator\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>&gt;\u003c/td>\u003ctd>Greater than\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>&gt;=\u003c/td>\u003ctd>Greater than or equal to\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>&lt;\u003c/td>\u003ctd>Less than\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>&lt;=\u003c/td>\u003ctd>Less than or equal to\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>==\u003c/td>\u003ctd>Equal to\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>!=\u003c/td>\u003ctd>Not equal to\u003c/td>\u003c/tr>\n   \u003c/table>\n   \u003ctable class=\"ref\">\n    \u003ctr>\u003cth>Operator\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Truth table\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd>&amp;&amp;\u003c/td>\u003ctd>AND\u003c/td>\u003ctd>true only if both sides are true\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>||\u003c/td>\u003ctd>OR\u003c/td>\u003ctd>true if either side is true\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>!\u003c/td>\u003ctd>NOT\u003c/td>\u003ctd>flips true/false\u003c/td>\u003c/tr>\n   \u003c/table>\n   \u003cp>\u003cb>Bitwise operators\u003c/b> act directly on the binary representation of integers (not float/double):\n   \u003ccode>&amp;\u003c/code> AND, \u003ccode>|\u003c/code> OR, \u003ccode>^\u003c/code> XOR, \u003ccode>~\u003c/code> NOT (one's complement),\n   \u003ccode>&gt;&gt;\u003c/code> shift right, \u003ccode>&lt;&lt;\u003c/code> shift left.\u003c/p>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch3-s2\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Ternary Operator\u003c/h3>\n        \u003cspan class=\"pageref\">p.41\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>A compact shorthand for if-else:\u003c/p>\n   \u003cdiv class=\"code\">y = x > 9 ? 100 : 200;\n// equivalent to:\nif (x > 9) y = 100;\nelse       y = 200;\u003c/div>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch3-s3\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Operator Precedence\u003c/h3>\n        \u003cspan class=\"pageref\">p.41\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>From highest to lowest:\u003c/p>\n   \u003col>\n    \u003cli>Parentheses \u003ccode>()\u003c/code>\u003c/li>\n    \u003cli>Unary operators &mdash; \u003ccode>! + -\u003c/code>\u003c/li>\n    \u003cli>Multiplication, division, modulus &mdash; \u003ccode>* / %\u003c/code>\u003c/li>\n    \u003cli>Addition and subtraction &mdash; \u003ccode>+ -\u003c/code>\u003c/li>\n    \u003cli>Relational operators &mdash; \u003ccode>&lt; &lt;= &gt; &gt;=\u003c/code>\u003c/li>\n    \u003cli>Equality operators &mdash; \u003ccode>== !=\u003c/code>\u003c/li>\n    \u003cli>Logical AND &mdash; \u003ccode>&amp;&amp;\u003c/code>\u003c/li>\n    \u003cli>Logical OR &mdash; \u003ccode>||\u003c/code> (lowest)\u003c/li>\n   \u003c/ol>\n   \u003cp>Five kinds of conditional statements: \u003cb>if\u003c/b>, \u003cb>if-else\u003c/b>, \u003cb>nested if\u003c/b>, \u003cb>if-else-if ladder\u003c/b>, \u003cb>switch\u003c/b>.\u003c/p>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch3-s4\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>if Statement\u003c/h3>\n        \u003cspan class=\"pageref\">p.42\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cdiv class=\"code\">if (condition)\n{\n   // code to execute if the condition is true\n}\u003c/div>\n   \u003cp>Never place a semicolon directly after the condition.\u003c/p>\n   \u003cdiv class=\"code\">#include&lt;stdio.h&gt;\nint grade;\nint main() {\n  printf(\"Enter Student grade:\");\n  scanf(\"%d\", &amp;grade);\n  if (grade >= 60)\n     printf(\"Congratulations, you PASSED!\");\n  return 0;\n}\u003c/div>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch3-s5\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>if-else Statement\u003c/h3>\n        \u003cspan class=\"pageref\">p.42&ndash;43\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cdiv class=\"code\">if (condition) { statement_1; }\nelse          { statement_2; }\u003c/div>\n   \u003cp>Only one of the two blocks ever runs &mdash; never both.\u003c/p>\n   \u003cdiv class=\"code\">if (grade >=60)\n   printf(\"Congratulations, you PASSED!\");\nelse\n   printf(\"Sorry, you FAILED!\");\u003c/div>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch3-s6\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>Nested if &amp; the Dangling-else Rule\u003c/h3>\n        \u003cspan class=\"pageref\">p.43&ndash;44\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cp>A \u003cb>nested if\u003c/b> is an if statement placed inside another if or else block. Turbo C resolves ambiguous\n   pairing with one rule: \u003cb>an else always pairs with the nearest preceding if that doesn't already have an else.\u003c/b>\u003c/p>\n   \u003cdiv class=\"code\">// Situation 1\nif (...)        // line 1\n   if (...)     // line 2\n      ...\n   else         // line 3 -> pairs with the if on line 2 (closest unmatched if)\n\n// Situation 2\nif (...)            // line 1\n{\n   if (...)         // line 3\n      ...\n}                    // line 4 closes the braces\nelse                 // line 5 -> pairs with the if on line 1,\n                     // because the braces {} scope off the inner if\u003c/div>\n   \u003cdiv class=\"code\">// Find the greatest of A, B, C\nif (A > B)\n   if (A > C) printf(\"A is the largest.\\n\");\n   else       printf(\"C is the largest.\\n\");\nelse\n   if (B > C) printf(\"B is the largest.\\n\");\n   else       printf(\"C is the largest.\\n\");\u003c/div>\n  \u003c/div>\n    \u003c/section>\n    \n    \u003csection class=\"entry\" id=\"ch3-s7\">\n      \u003cdiv class=\"entry-head\">\n        \u003ch3>if-else-if Ladder\u003c/h3>\n        \u003cspan class=\"pageref\">p.44&ndash;46\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"entry-body\">\n   \u003cdiv class=\"code\">if (condition_1)      statement_1;\nelse if (condition_2) st
